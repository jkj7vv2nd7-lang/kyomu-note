<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KyomuNote ― デジタル教務手帳</title>
<meta name="description" content="教員向けデジタル教務手帳 KyomuNote（第2期）。週案・授業記録・名簿・出欠・提出物・成績を端末の中だけで安全に。">
<meta property="og:title" content="KyomuNote ― デジタル教務手帳">
<meta property="og:description" content="週案・授業記録・行事を、端末の中だけで安全に扱う教員向け教務手帳。">
<meta property="og:type" content="website">
<meta property="og:image" content="og-image.png">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --navy:#1b2a4a; --navy2:#24365e; --paper:#f7f2e7; --paper2:#efe7d6; --gold:#b8860b; --gold2:#d4a017;
  --ink:#2b2b26; --muted:#6d675a; --line:#d8cfb8; --card:#fffdf7; --danger:#a33b3b; --ok:#3d7a4e;
  --cancelled:#f3d9d9; --changed:#fdeec9; --supervised:#dde8f5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* ヘッダー */
header#appHeader{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appname{font-size:22px;font-weight:700;letter-spacing:.04em;color:#f3d98b}
.appname small{font-size:12px;color:#cdbf9d;font-weight:400;margin-left:6px}
.hspacer{flex:1}
.hbtn{background:var(--navy2);color:#fff;border:1px solid #4a5f8a;border-radius:10px;padding:9px 14px;font-size:16px;min-height:44px}
.hbtn.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.hbtn.privacy-on{background:#7a4b9e;border-color:#7a4b9e;font-weight:700}
nav.mainnav{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
nav.mainnav button{flex:1;min-width:76px}

main{max-width:1180px;margin:0 auto;padding:14px 12px 60px}
h2.viewtitle{font-size:24px;color:var(--navy);margin:6px 0 10px;border-bottom:3px solid var(--gold);padding-bottom:6px}
h3.sect{font-size:19px;color:var(--navy);margin:20px 0 8px;border-left:6px solid var(--gold);padding-left:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px 20px;font-size:18px;min-height:52px;font-weight:600}
.btn.gold{background:var(--gold)} .btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.small{padding:8px 14px;font-size:16px;min-height:44px} .btn.danger{background:var(--danger)}
.btn:disabled{opacity:.45}
.rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:block;margin:12px 0 4px;font-weight:600;color:var(--navy)}
input.t,select.t,textarea.t{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
textarea.t{min-height:74px;resize:vertical}
.savednote{color:var(--ok);font-size:14px;min-height:20px}
.muted{color:var(--muted);font-size:15px}
.badge{display:inline-block;background:var(--gold);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700;vertical-align:middle}

/* 週案 */
.weeknav{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.weeknav .btn{flex:1;min-width:90px}
.weektitle{font-size:19px;font-weight:700;color:var(--navy);text-align:center}
table.week{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}
table.week th,table.week td{border:1px solid var(--line);vertical-align:top;padding:5px;font-size:13.5px}
table.week th{background:var(--paper2);color:var(--navy);font-size:14px}
table.week th.today,table.week td.today{background:#fdf6dd}
table.week td.nowcell{outline:3px solid var(--gold);outline-offset:-3px;background:#fdf6dd}
table.week td.st-cancelled{background:var(--cancelled)} table.week td.st-changed{background:var(--changed)} table.week td.st-supervised{background:var(--supervised)}
td.cell{min-height:56px;cursor:pointer}
td.cell .cname{font-weight:700;font-size:14px;color:var(--navy)}
td.cell .unit{color:#55503f} td.cell .memo{color:#7a6a3a;font-size:12.5px}
td.cell .ev{color:var(--gold);font-weight:700;font-size:12.5px}
.plabel{width:44px;text-align:center;font-weight:700;color:var(--navy);background:var(--paper2)}

/* 月間・年間 */
table.cal{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}
table.cal th,table.cal td{border:1px solid var(--line);vertical-align:top;padding:4px;font-size:13px}
table.cal td{min-height:74px;cursor:pointer} table.cal td.today{background:#fdf6dd} table.cal td.out{opacity:.35;cursor:default}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.recdot{color:var(--gold);font-weight:900}
.daynote-mini{color:#7a6a3a;font-size:12px}
.minical{font-size:11px} .minical td{min-height:26px;text-align:center;cursor:pointer;padding:2px}
.minical td.has{background:#f3e9c8;font-weight:700}
.termband{border-radius:10px;padding:10px 14px;margin:6px 0;color:#fff;font-weight:600}
.counterbar{height:16px;background:#e7dfc9;border-radius:8px;overflow:hidden}
.counterbar>div{height:100%;background:var(--gold)}

/* ロック・ウィザード */
.overlay{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,#101a30 70%);z-index:100;overflow:auto;padding:22px 14px}
.lockbox{max-width:440px;margin:0 auto;background:var(--paper);border-radius:20px;padding:26px 22px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.logotitle{text-align:center;color:var(--navy)}
.logotitle .big{font-size:38px;font-weight:800;letter-spacing:.05em}
.logotitle .sub{color:var(--gold);font-weight:700}
.pindots{text-align:center;font-size:34px;letter-spacing:.35em;min-height:52px;color:var(--navy)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:10px auto}
.pinpad button{background:#fff;border:2px solid var(--line);border-radius:16px;font-size:26px;padding:16px 0;min-height:64px;font-weight:700;color:var(--navy)}
.pinpad button:active{background:var(--paper2)}
.lockmsg{text-align:center;color:var(--danger);min-height:24px;font-weight:600}
.wizbox{max-width:680px;margin:0 auto;background:var(--paper);border-radius:20px;padding:26px 22px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.wizstep{font-size:15px;color:var(--gold);font-weight:700}
table.slotgrid{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}
table.slotgrid th,table.slotgrid td{border:1px solid var(--line);padding:4px;font-size:12.5px;text-align:center}
table.slotgrid td{min-height:40px;cursor:pointer} table.slotgrid td.filled{background:#fdf6dd;font-weight:600;color:var(--navy)}
table.slotgrid td.sel{outline:3px solid var(--gold);outline-offset:-3px}

/* シート（モーダル） */
#sheetBackdrop{position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheetBox{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 30px}
@media(min-width:760px){#sheetBackdrop{align-items:center}#sheetBox{border-radius:20px}}
.listitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.listitem .t{font-weight:700;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:999px;z-index:200;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.statusseg{display:flex;gap:8px;flex-wrap:wrap}
.statusseg button{flex:1;min-width:70px;padding:11px 6px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;min-height:48px}
.statusseg button.on{border-color:var(--gold);background:#fdf6dd;font-weight:700}

/* 第2期 */
.seatgrid{display:grid;gap:6px}
.seatcell{border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:64px;padding:6px;font-size:14px;cursor:pointer;text-align:center}
.seatcell.nonseat{background:#d9d9d9;color:#666;cursor:pointer}
.seatcell.empty{background:#fbf8ef;color:var(--muted)}
.seatcell.swap1{outline:3px solid var(--gold);outline-offset:-3px}
.chip{display:inline-block;border-radius:999px;background:#fdeec9;border:1px solid var(--gold);padding:0 8px;font-size:13px;font-weight:700}
table.plain{border-collapse:collapse;width:100%;background:#fff}
table.plain th,table.plain td{border:1px solid var(--line);padding:6px 8px;font-size:15px;text-align:left}
table.plain th{background:var(--paper2);color:var(--navy)}
.bar{height:14px;background:#e7dfc9;border-radius:7px;overflow:hidden}
.bar>div{height:100%;background:var(--ok)}
input.t.smallnum{max-width:110px;display:inline-block}
.warnbox{background:#fdf0f0;border:1.5px solid var(--danger);border-radius:10px;padding:10px 12px;margin:10px 0}
</style>
</head>
<body>

<header id="appHeader" class="hidden">
  <div class="hrow">
    <div class="appname">KyomuNote<small>デジタル教務手帳 v2.0.0</small></div>
    <div class="hspacer"></div>
    <span id="headerYear" class="muted" style="color:#cdbf9d"></span>
    <button class="hbtn" id="privacyBtn" title="プライバシーモード切替">🙈 プライバシー OFF</button>
    <button class="hbtn" id="lockBtn" title="手動ロック">🔒 ロック</button>
  </div>
  <nav class="mainnav">
    <button class="hbtn" data-nav="home">ホーム</button>
    <button class="hbtn" data-nav="today">今日</button>
    <button class="hbtn" data-nav="week">週案</button>
    <button class="hbtn" data-nav="month">月間</button>
    <button class="hbtn" data-nav="year">年間</button>
    <button class="hbtn" data-nav="courses">講座</button>
    <button class="hbtn" data-nav="settings">設定</button>
  </nav>
</header>

<main id="viewRoot" class="hidden"></main>

<!-- ロック画面 -->
<div id="lockScreen" class="overlay hidden">
  <div class="lockbox">
    <div class="logotitle">
      <div class="big">KyomuNote</div>
      <div class="sub">デジタル教務手帳 ― 第2期 v2.0.0</div>
      <p class="muted">PINを入力してロックを解除してください。<br>データはこの端末の中だけに保存されます。</p>
    </div>
    <div class="pindots" id="pinDots">○○○○</div>
    <div class="lockmsg" id="lockMsg"></div>
    <div class="pinpad" id="pinPad"></div>
    <div class="rowflex" style="justify-content:center;margin-top:8px">
      <button class="btn gold" id="unlockBtn" style="min-width:200px">ロック解除</button>
    </div>
  </div>
</div>

<!-- 初回ウィザード -->
<div id="wizardScreen" class="overlay hidden">
  <div class="wizbox" id="wizardBox"></div>
</div>

<!-- シート -->
<div id="sheetBackdrop" class="hidden"><div id="sheetBox"></div></div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
// KyomuNote logic.mjs — 純粋ロジック（UI・IndexedDBに触れない）
// Node から import してテスト可能。ブラウザでは build.mjs が export を外して連結する。

const MASK_TEXT = "―― 非表示 ――";

const PERIODS = [
  { code: 0, label: "朝", short: "朝" },
  { code: 1, label: "1限", short: "1" },
  { code: 2, label: "2限", short: "2" },
  { code: 3, label: "3限", short: "3" },
  { code: 4, label: "4限", short: "4" },
  { code: 5, label: "5限", short: "5" },
  { code: 6, label: "6限", short: "6" },
  { code: 7, label: "7限", short: "7" },
  { code: 8, label: "放課後", short: "放" },
];
const PERIOD_CODES = PERIODS.map((p) => p.code);

function periodLabel(code) {
  const p = PERIODS.find((x) => x.code === Number(code));
  return p ? p.label : String(code);
}
function periodShortLabel(code) {
  const p = PERIODS.find((x) => x.code === Number(code));
  return p ? p.short : String(code);
}

const LESSON_STATUSES = [
  { id: "normal", label: "通常" },
  { id: "cancelled", label: "休講" },
  { id: "changed", label: "振替" },
  { id: "supervised", label: "自習監督" },
];
function statusLabel(id) {
  const s = LESSON_STATUSES.find((x) => x.id === id);
  return s ? s.label : "通常";
}

const EVENT_CATEGORIES = [
  { id: "event", label: "行事", color: "#b8860b" },
  { id: "exam", label: "考査", color: "#a33b3b" },
  { id: "trip", label: "出張", color: "#3b6ea5" },
  { id: "deadline", label: "〆切", color: "#7a4b9e" },
  { id: "duty", label: "分掌", color: "#3d7a4e" },
  { id: "daynote", label: "一言メモ", color: "#888888" },
];
function categoryLabel(id) {
  const c = EVENT_CATEGORIES.find((x) => x.id === id);
  return c ? c.label : id;
}
function categoryColor(id) {
  const c = EVENT_CATEGORIES.find((x) => x.id === id);
  return c ? c.color : "#888888";
}
function isDayNote(ev) { return !!ev && ev.category === "daynote"; }
function isRealEvent(ev) { return !!ev && ev.category !== "daynote"; }

// ---------- 日付ユーティリティ（すべて YYYY-MM-DD 文字列） ----------
function pad2(n) { return String(n).padStart(2, "0"); }

function formatDate(y, m, d) {
  return `${y}-${pad2(m)}-${pad2(d)}`;
}
function toDateString(dateObj) {
  return formatDate(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
}
function todayString(now = new Date()) { return toDateString(now); }

function isValidDateString(s) {
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split("-").map(Number);
  if (m < 1 || m > 12 || d < 1 || d > 31) return false;
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
function parseDateString(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(dateStr, n) {
  const dt = parseDateString(dateStr);
  dt.setDate(dt.getDate() + n);
  return toDateString(dt);
}
function addMonths(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  dt.setDate(Math.min(d, last));
  return toDateString(dt);
}
function diffDays(a, b) {
  // b - a（日数）
  const ms = parseDateString(b).getTime() - parseDateString(a).getTime();
  return Math.round(ms / 86400000);
}
function compareDates(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
function dateInRange(dateStr, start, end) {
  return dateStr >= start && dateStr <= end;
}
// JS Date.getDay 互換：0=日 … 6=土
function dayOfWeek(dateStr) { return parseDateString(dateStr).getDay(); }
// 1=月 … 6=土、0=日（baseSlots.dayOfWeek と同じ体系、日曜は0）
function dayOfWeekMon1(dateStr) { return dayOfWeek(dateStr); }
const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];
function weekdayLabel(dateStr) { return WEEKDAY_LABELS[dayOfWeek(dateStr)]; }

function mondayOfWeek(dateStr) {
  const dow = dayOfWeek(dateStr); // 0=日
  const offset = dow === 0 ? -6 : 1 - dow;
  return addDays(dateStr, offset);
}
const getMondayOfWeek = mondayOfWeek;
const weekMonday = mondayOfWeek;

function weekDates(mondayStr) {
  const out = [];
  for (let i = 0; i < 6; i++) out.push(addDays(mondayStr, i)); // 月〜土
  return out;
}
function monthFirst(dateStr) { return dateStr.slice(0, 8) + "01"; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

// 年度：4月1日〜翌年3月31日
function yearRange(yearId) {
  const y = Number(yearId);
  return { startDate: `${y}-04-01`, endDate: `${y + 1}-03-31` };
}
const getYearRange = yearRange;
function academicYearOf(dateStr) {
  const [y, m] = dateStr.split("-").map(Number);
  return m >= 4 ? y : y - 1;
}
function academicMonths(yearId) {
  const y = Number(yearId);
  const out = [];
  for (let i = 0; i < 12; i++) {
    const mm = 4 + i;
    out.push({ year: mm <= 12 ? y : y + 1, month: ((mm - 1) % 12) + 1 });
  }
  return out;
}

// ---------- 学期 ----------
function defaultTerms(yearId, termSystem) {
  const y = Number(yearId);
  const mk = (n, name, s, e) => ({ id: `${y}-T${n}`, yearId: y, name, startDate: s, endDate: e });
  if (String(termSystem) === "2") {
    return [
      mk(1, "前期", `${y}-04-01`, `${y}-09-30`),
      mk(2, "後期", `${y}-10-01`, `${y + 1}-03-31`),
    ];
  }
  return [
    mk(1, "1学期", `${y}-04-01`, `${y}-08-31`),
    mk(2, "2学期", `${y}-09-01`, `${y}-12-31`),
    mk(3, "3学期", `${y + 1}-01-01`, `${y + 1}-03-31`),
  ];
}
const generateDefaultTerms = defaultTerms;
const createDefaultTerms = defaultTerms;

function termForDate(terms, dateStr) {
  if (!terms) return null;
  for (const t of terms) {
    if (dateInRange(dateStr, t.startDate, t.endDate)) return t;
  }
  return null;
}
const findTermForDate = termForDate;
const getTermForDate = termForDate;
function termIdForDate(terms, dateStr) {
  const t = termForDate(terms, dateStr);
  return t ? t.id : null;
}

// ---------- コマ ----------
function lessonKey(dateStr, period) { return `${dateStr}#${Number(period)}`; }
const lessonId = lessonKey;
const makeLessonKey = lessonKey;
const komaKey = lessonKey;

const RECORD_FIELDS = ["unit", "goal", "plan", "board", "materials", "progress", "reflection", "handoff", "gapMemo", "shortMemo"];
function computeHasRecord(lesson) {
  if (!lesson) return false;
  return RECORD_FIELDS.some((f) => typeof lesson[f] === "string" && lesson[f].trim() !== "");
}
const hasRecordOf = computeHasRecord;

// 週案フレーム：基本枠＋lessons の重ね合わせ用データ整形
// 戻り値 { monday, dates:[月..土], rows:[{period, label, cells:[cell x6]}] }
// cell = { date, period, dayOfWeek, baseSlot|null, lesson|null, courseId, hasRecord }
function buildWeekFrame(baseSlots, lessons, mondayStr, courses) {
  const dates = weekDates(mondayStr);
  const lessonMap = new Map();
  for (const l of lessons || []) lessonMap.set(l.id, l);
  const baseMap = new Map();
  for (const b of baseSlots || []) baseMap.set(`${b.dayOfWeek}#${b.period}`, b);
  const courseMap = new Map();
  for (const c of courses || []) courseMap.set(c.id, c);
  const rows = PERIODS.map((p) => {
    const cells = dates.map((date) => {
      const dow = dayOfWeek(date);
      const baseSlot = baseMap.get(`${dow}#${p.code}`) || null;
      const lesson = lessonMap.get(lessonKey(date, p.code)) || null;
      const courseId = (lesson && lesson.courseId) || (baseSlot && baseSlot.courseId) || null;
      return {
        date, period: p.code, dayOfWeek: dow,
        baseSlot, lesson, courseId,
        course: courseId ? courseMap.get(courseId) || null : null,
        label: baseSlot ? baseSlot.label || "" : "",
        kind: baseSlot ? baseSlot.kind : null,
        hasRecord: lesson ? computeHasRecord(lesson) : false,
        status: lesson ? lesson.status || "normal" : "normal",
        unit: lesson ? lesson.unit || "" : "",
        shortMemo: lesson ? lesson.shortMemo || "" : "",
      };
    });
    return { period: p.code, label: p.label, cells };
  });
  return { monday: mondayStr, dates, rows };
}
const generateWeekFrame = buildWeekFrame;
const makeWeekFrame = buildWeekFrame;

// 現在時刻から「今の時限」の目安（表示強調用）
function currentPeriodCode(now = new Date()) {
  const h = now.getHours();
  if (h < 9) return 0;
  if (h < 10) return 1;
  if (h < 11) return 2;
  if (h < 12) return 3;
  if (h < 14) return 4;
  if (h < 15) return 5;
  if (h < 16) return 6;
  if (h < 17) return 7;
  return 8;
}

// ---------- プライバシーマスキング ----------
// level: 1=一般（自由記述を伏せる） 2=個人情報（同上） 3=要配慮（セクションごと隠す想定で伏せる）
function maskText(text, level = 1, privacyOn = true) {
  if (!privacyOn) return text == null ? "" : String(text);
  if (text == null || String(text).trim() === "") return "";
  return MASK_TEXT;
}
const maskFreeText = maskText;

function submissionAchievement(evalKind, state) {

  if (evalKind === "check") {

// ---------- 観点別集計・評定シミュレーション（設計 §3.4） ----------
// 既定値は「仮置き」。すべて gradeSettings として講座・学期ごとに変更できる。
function defaultGradeSettings() {
  return {
    viewWeights: { knowledge: 0.34, thinking: 0.33, attitude: 0.33 },
    thresholds: [
      { min: 0.8, label: "A" },
      { min: 0.5, label: "B" },
      { min: 0, label: "C" },
    ],
    ratingTable: [
      { min: 0.85, rating: 5 },
      { min: 0.7, rating: 4 },

      { min: 0.3, rating: 2 },

function ratingForScore(score, table) {

  for (const row of sorted) if (score >= row.min - 1e-9) return row.rating != null ? row.rating : row.label;

}
// materials: [{ viewWeights, achievements: { studentId: 0..1 | null } }]
// 戻り値: { studentId: { perView: { knowledge: {score, rating} | null, ... }, finalScore, rating } }
function computeGrades(materials, settings) {
  const gs = settings || defaultGradeSettings();
  const viewWeights = normalizeViewWeights(gs.viewWeights);
  const studentIds = new Set();
  for (const m of materials || []) {
    for (const id of Object.keys(m.achievements || {})) studentIds.add(id);
  }
  const out = {};
  for (const sid of studentIds) {
    const perView = {};
    for (const vid of VIEWPOINT_IDS) {
      let num = 0, den = 0;
      for (const m of materials || []) {
        const ach = m.achievements ? m.achievements[sid] : null;
        if (ach == null) continue;
        const w = Math.max(0, Number((m.viewWeights || {})[vid]) || 0);
        if (w <= 0) continue;
        num += ach * w; den += w;
      }
      perView[vid] = den > 0
        ? { score: num / den, rating: ratingForScore(num / den, gs.thresholds) }
        : null;
    }
    let fNum = 0, fDen = 0;
    for (const vid of VIEWPOINT_IDS) {
      if (!perView[vid]) continue;
      fNum += perView[vid].score * viewWeights[vid];
      fDen += viewWeights[vid];
    }
    const finalScore = fDen > 0 ? fNum / fDen : null;
    out[sid] = { perView, finalScore, rating: ratingForScore(finalScore, gs.ratingTable) };

}

// ---------- 進度トラッカー（設計 §3.2 units・§4.1 progress） ----------

function computeProgress(units, lessons) {

    if (!l || !l.unitId) continue;
    if (l.status === "cancelled") continue;
    doneByUnit[l.unitId] = (doneByUnit[l.unitId] || 0) + 1;
  }
  let totalPlanned = 0, totalScore = 0, cumulative = 0, currentUnitId = null;
  const perUnit = sorted.map((u) => {
    const planned = Math.max(0, Number(u.plannedLessons) || 0);
    const done = doneByUnit[u.id] || 0;
    const score = planned > 0 ? Math.min(done, planned) : done;
    totalPlanned += planned; totalScore += score; cumulative += planned;
    if (done > 0) currentUnitId = u.id;
    return { unitId: u.id, name: u.name || "", planned, done, score, cumulativePlanned: cumulative };

    perUnit, totalPlanned, totalScore, currentUnitId,

}

// ===== WebCrypto（PIN・鍵導出） =====
function b64encode(buf){ let s=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64decode(str){ const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
async function deriveKey(pin, saltB64, iterations){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt: new Uint8Array(b64decode(saltB64)), iterations: iterations||600000, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function makeKeyCheck(key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(KEYCHECK_PLAIN));
  return { iv: b64encode(iv.buffer), data: b64encode(data) };
}
async function verifyKeyCheck(key, keyCheck){
  try {
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: new Uint8Array(b64decode(keyCheck.iv)) }, key, b64decode(keyCheck.data));
    return new TextDecoder().decode(plain) === KEYCHECK_PLAIN;
  } catch(e){ return false; }
}
// ===== 第2期：レコード単位暗号化レイヤー（設計 §3.3・§5.1）=====
async function encryptRecord(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64encode(iv.buffer), data: b64encode(data) };
}
async function decryptRecord(key, enc){
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: new Uint8Array(b64decode(enc.iv)) }, key, b64decode(enc.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function decryptMerge(rec){
  if (!rec) return null;
  if (!rec.enc) return rec;
  try {
    const body = await decryptRecord(state.key, rec.enc);
    const plain = Object.assign({}, rec); delete plain.enc;
    return Object.assign(plain, body);
  } catch(e){
    const plain = Object.assign({}, rec); delete plain.enc;
    plain.decryptError = true;
    return plain;
  }
}
async function putEnc(store, plain, body){
  if (!state.key) throw new Error("鍵がありません（ロック中です）");
  const enc = await encryptRecord(state.key, body || {});
  const rec = Object.assign({}, plain, { enc, level: 2, updatedAt: new Date().toISOString() });
  await dbPut(store, rec);
  return rec;
}
async function getEnc(store, id){
  const rec = await dbGet(store, id);
  return rec ? decryptMerge(rec) : null;
}
async function getAllEnc(store){
  const all = await dbGetAll(store);
  const out = [];
  for (const r of all) out.push(await decryptMerge(r));
  return out;
}
async function getEncByIndex(store, idx, q){
  const all = await dbGetByIndex(store, idx, q);
  const out = [];
  for (const r of all) out.push(await decryptMerge(r));
  return out;
}
window.__KYOMU__.crypto = { encryptRecord, decryptRecord };
window.__KYOMU__.enc = { putEnc, getEnc, getAllEnc, getEncByIndex };

async function createSecurity(pin){
  const salt = b64encode(crypto.getRandomValues(new Uint8Array(16)).buffer);
  const iterations = 600000;
  const key = await deriveKey(pin, salt, iterations);
  const keyCheck = await makeKeyCheck(key);
  const rec = { key:"security", salt, iterations, keyCheck, failCount:0, waitUntil:0 };
  await dbPut("meta", rec);
  return { key, rec };
}

// ===== ロック =====
let pinBuffer = "";
function showLock(msg){
  state.unlocked = false; state.key = null;
  document.getElementById("appHeader").classList.add("hidden");
  document.getElementById("viewRoot").classList.add("hidden");
  document.getElementById("wizardScreen").classList.add("hidden");
  document.getElementById("sheetBackdrop").classList.add("hidden");
  const ls = document.getElementById("lockScreen");
  ls.classList.remove("hidden");
  pinBuffer = ""; renderPinDots();
  document.getElementById("lockMsg").textContent = msg || "";
  checkPinWait();
}
function renderPinDots(){
  const n = pinBuffer.length;
  document.getElementById("pinDots").textContent = "●".repeat(n) + "○".repeat(Math.max(0, 4-n));
}
function checkPinWait(){
  const sec = state.security;
  if (sec && sec.waitUntil && Date.now() < sec.waitUntil){
    const left = Math.ceil((sec.waitUntil - Date.now())/1000);
    document.getElementById("lockMsg").textContent = `PINを連続で誤りました。あと ${left} 秒お待ちください。`;
    return left;
  }
  return 0;
}
async function tryUnlock(){
  if (checkPinWait() > 0) return;
  if (!isValidPin(pinBuffer)){ document.getElementById("lockMsg").textContent = "PINは4〜6桁の数字です。"; return; }
  const sec = state.security;
  const key = await deriveKey(pinBuffer, sec.salt, sec.iterations);
  const ok = await verifyKeyCheck(key, sec.keyCheck);
  if (ok){
    sec.failCount = 0; sec.waitUntil = 0; await dbPut("meta", sec);
    state.key = key; state.unlocked = true; pinBuffer = "";
    document.getElementById("lockScreen").classList.add("hidden");
    await enterApp();
  } else {
    sec.failCount = (sec.failCount||0) + 1;
    const wait = pinWaitSeconds(sec.failCount);
    sec.waitUntil = wait > 0 ? Date.now() + wait*1000 : 0;
    await dbPut("meta", sec);
    pinBuffer = ""; renderPinDots();
    document.getElementById("lockMsg").textContent = wait > 0
      ? `PINが違います。${wait}秒の待機時間が発生しました。`
      : "PINが違います。もう一度入力してください。";
  }
}
function lockApp(msg){ showLock(msg || "ロックしました。"); }
window.__KYOMU_ON_VERSIONCHANGE__ = function(){

};

// PINパッド生成
(function buildPinPad(){
  const pad = document.getElementById("pinPad");
  const keys = ["1","2","3","4","5","6","7","8","9","C","0","⌫"];
  keys.forEach(k=>{
    const b = document.createElement("button");
    b.textContent = k; b.type = "button";
    b.addEventListener("click", ()=>{
      if (k==="C") pinBuffer = "";
      else if (k==="⌫") pinBuffer = pinBuffer.slice(0,-1);
      else if (pinBuffer.length < 6) pinBuffer += k;
      renderPinDots();
    });
    pad.appendChild(b);
  });
  document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
  document.addEventListener("keydown", (e)=>{
    if (document.getElementById("lockScreen").classList.contains("hidden")) return;
    if (/^\d$/.test(e.key) && pinBuffer.length < 6){ pinBuffer += e.key; renderPinDots(); }
    if (e.key === "Backspace"){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); }
    if (e.key === "Enter") tryUnlock();
  });
})();

async function loadYearData(){
  if (!state.currentYearId) { state.terms=[]; state.courses=[]; state.baseSlots=[]; state.groups=[]; state.students=[]; state.memberships=[]; return; }
  state.terms = (await getTermsByYear(state.currentYearId)).sort((a,b)=>a.startDate<b.startDate?-1:1);
  state.courses = await getCoursesByYear(state.currentYearId);
  state.baseSlots = await getBaseSlotsByYear(state.currentYearId);
  state.eventsCache = await getEventsByYear(state.currentYearId);
  // 第2期：名簿グループ・生徒（復号してキャッシュ）・所属
  state.groups = await getGroupsByYear(state.currentYearId);
  const rawStudents = await getStudentsByYear(state.currentYearId);
  state.students = [];
  for (const r of rawStudents) state.students.push(await decryptMerge(r));
  state.memberships = [];
  for (const g of state.groups){
    const ms = await getMembershipsByGroup(g.id);
    for (const m of ms) state.memberships.push(m);
  }
}

async function renderWeek(root){
  const monday = state.weekMonday;
  const dates = weekDates(monday);
  const lessons = await getLessonsInRange(dates[0], dates[5]);
  state.lessonsCache = lessons;
  const frame = buildWeekFrame(state.baseSlots, lessons, monday, state.courses);
  const today = todayString();
  const nowPeriod = currentPeriodCode();
  const evByDate = {};
  for (const d of dates) evByDate[d] = eventsOnDate(state.eventsCache, d).filter(isRealEvent);
  let h = `<h2 class="viewtitle">週案</h2>
  <div class="weeknav">
    <button class="btn small ghost" id="prevWeek">◀ 前週</button>
    <div class="weektitle">${esc(monday)} の週<br><span class="muted" style="font-size:14px">${state.currentYearId}年度</span></div>
    <button class="btn small ghost" id="thisWeek">今週</button>
    <button class="btn small ghost" id="nextWeek">翌週 ▶</button>
  </div><div style="overflow-x:auto"><table class="week"><tr><th class="plabel">時限</th>`;
  dates.forEach((d,i)=>{
    const evs = evByDate[d].map(e=>`<div class="ev">◆ ${esc(e.title)}</div>`).join("");
    h += `<th class="${d===today?"today":""}">${WEEKDAY_LABELS[dayOfWeek(d)]}<br>${esc(d.slice(5))}${d===today?' <span class="badge">今日</span>':""}${evs}</th>`;
  });
  h += `</tr>`;
  for (const row of frame.rows){
    h += `<tr><td class="plabel">${esc(row.label)}</td>`;
    for (const cell of row.cells){
      const cls = ["cell", cell.date===today?"today":"", (cell.date===today && cell.period===nowPeriod)?"nowcell":"", cell.status!=="normal"?("st-"+cell.status):""].join(" ");
      const name = cell.course ? esc(cell.course.name) : (cell.label ? esc(cell.label) : "");
      const sub = cell.course ? esc(cell.course.classLabel) : (cell.baseSlot ? esc(categoryLabelForKind(cell.baseSlot.kind)) : "");
      h += `<td class="${cls}" data-date="${cell.date}" data-period="${cell.period}">
        ${name?`<div class="cname">${name}</div><div>${esc(sub)}</div>`:`<div class="muted">―</div>`}
        ${cell.unit?`<div class="unit">単元：${esc(cell.unit)}</div>`:""}
        ${cell.shortMemo?`<div class="memo">✎ ${esc(mask(cell.shortMemo))}</div>`:""}
        ${cell.hasRecord?`<span class="badge">記録あり</span>`:""}
        ${cell.status!=="normal"?`<div>【${esc(statusLabel(cell.status))}】</div>`:""}
      </td>`;
    }
    h += `</tr>`;
  }
  h += `</table></div><p class="muted">マスをタップするとコマシート（一言メモ・状態・授業記録への入口）が開きます。</p>`;
  root.innerHTML = h;
  document.getElementById("prevWeek").onclick = ()=>{ state.weekMonday = addDays(state.weekMonday,-7); render(); };
  document.getElementById("nextWeek").onclick = ()=>{ state.weekMonday = addDays(state.weekMonday,7); render(); };
  document.getElementById("thisWeek").onclick = ()=>{ state.weekMonday = mondayOfWeek(todayString()); render(); };
  root.querySelectorAll("td.cell").forEach(td=>td.addEventListener("click", ()=>{
    openSlotSheet(td.dataset.date, Number(td.dataset.period));
  }));
}

  document.getElementById("lessonStatus").addEventListener("change", (e)=>{ lesson.status = e.target.value; save(); });
}

// ===== 日のコマ一覧ヘルパー（今日／日エリア共通）=====
async function buildDayCells(date){
  const lessons = await getLessonsInRange(date, date);
  const lmap = new Map(lessons.map(l=>[l.period, l]));
  const dow = dayOfWeek(date);
  return PERIODS.map(p=>{
    const base = state.baseSlots.find(b=>b.dayOfWeek===dow && b.period===p.code) || null;
    const lesson = lmap.get(p.code) || null;
    const courseId = (lesson && lesson.courseId) || (base && base.courseId) || null;
    return { date, period:p.code, base, lesson, courseId,
      course: state.courses.find(c=>c.id===courseId) || null,
      hasRecord: lesson ? computeHasRecord(lesson) : false,
      status: lesson ? lesson.status || "normal" : "normal" };
  });
}
function dayNoteOf(date){ return state.eventsCache.find(e=>e.category==="daynote" && e.startDate===date) || null; }
function cellTitle(cell){
  if (cell.course) return `${cell.course.subject} ${cell.course.name}（${cell.course.classLabel}）`;
  if (cell.base && cell.base.label) return cell.base.label;
  if (cell.base) return categoryLabelForKind(cell.base.kind);
  return "（予定なし）";
}

  root.querySelectorAll("[data-d-sheet]").forEach(b=>b.onclick=()=>openSlotSheet(date, Number(b.dataset.dSheet)));
  root.querySelectorAll("[data-d-check]").forEach(b=>b.onclick=()=>{ state.selectedPeriod=Number(b.dataset.dCheck); state.view="check"; render(); });
  const saveDn = async ()=>{
    const title = document.getElementById("dnTitle").value;
    const memo = document.getElementById("dnMemo").value;
    let rec = dayNoteOf(date);
    if (!title.trim() && !memo.trim()){
      if (rec){ await dbDelete("events", rec.id); state.eventsCache = state.eventsCache.filter(e=>e.id!==rec.id); }
      return;
    }
    if (!rec){ rec = { id: uuid(), yearId: state.currentYearId, category:"daynote", startDate: date, endDate: date, level:1 }; state.eventsCache.push(rec); }
    rec.title = title; rec.memo = memo; rec.yearId = state.currentYearId;
    await dbPut("events", rec);
    const el = document.getElementById("dnSaved"); if (el) el.textContent = "保存済み " + new Date().toLocaleTimeString("ja-JP");
  };
  ["dnTitle","dnMemo"].forEach(id=>{ const el=document.getElementById(id); if (el) el.addEventListener("input", saveDn); });
}

// ===== 行事編集シート =====
function openEventSheet(ev, defaultDate){
  const isNew = !ev;
  ev = ev || { id: uuid(), yearId: state.currentYearId, title:"", startDate: defaultDate||state.selectedDate, endDate: defaultDate||state.selectedDate, category:"event", memo:"", level:1 };
  openSheet(`
    <h3 class="sect" style="margin-top:0">${isNew?"行事を追加":"行事を編集"}</h3>
    <label class="f">タイトル</label><input class="t" id="evTitle" value="${esc(ev.title)}">
    <div class="rowflex"><div style="flex:1"><label class="f">開始日</label><input class="t" type="date" id="evStart" value="${esc(ev.startDate)}"></div>
    <div style="flex:1"><label class="f">終了日</label><input class="t" type="date" id="evEnd" value="${esc(ev.endDate)}"></div></div>
    <label class="f">カテゴリ</label>
    <select class="t" id="evCat">${EVENT_CATEGORIES.filter(c=>c.id!=="daynote").map(c=>`<option value="${c.id}" ${ev.category===c.id?"selected":""}>${c.label}</option>`).join("")}</select>
    <label class="f">メモ</label><textarea class="t" id="evMemo">${esc(ev.memo||"")}</textarea>
    <div class="rowflex" style="margin-top:16px">
      <button class="btn gold" id="evSave">保存する</button>
      ${isNew?"":`<button class="btn danger" id="evDelete">削除</button>`}
      <button class="btn ghost" id="evCancel">キャンセル</button></div>`);
  document.getElementById("evCancel").onclick = ()=>closeSheet();
  document.getElementById("evSave").onclick = async ()=>{
    ev.title = document.getElementById("evTitle").value.trim() || "（無題）";
    ev.startDate = document.getElementById("evStart").value || ev.startDate;
    ev.endDate = document.getElementById("evEnd").value || ev.startDate;
    if (ev.endDate < ev.startDate) ev.endDate = ev.startDate;
    ev.category = document.getElementById("evCat").value;
    ev.memo = document.getElementById("evMemo").value;
    ev.yearId = state.currentYearId; ev.level = 1;
    await dbPut("events", ev);
    const i = state.eventsCache.findIndex(e=>e.id===ev.id);
    if (i>=0) state.eventsCache[i]=ev; else state.eventsCache.push(ev);
    closeSheet(); toast("行事を保存しました"); render();
  };
  const del = document.getElementById("evDelete");
  if (del) del.onclick = async ()=>{ await dbDelete("events", ev.id); state.eventsCache = state.eventsCache.filter(e=>e.id!==ev.id); closeSheet(); render(); };
}

// ===== 月間ビュー =====
async function renderMonth(root){
  if (!state.monthCursor) state.monthCursor = todayString().slice(0,7);
  const [cy, cm] = state.monthCursor.split("-").map(Number);
  const first = formatDate(cy, cm, 1);
  const last = formatDate(cy, cm, daysInMonth(cy, cm));
  const lessons = await getLessonsInRange(first, last);
  const recDates = new Set(lessons.filter(l=>computeHasRecord(l)).map(l=>l.date));
  const gridStart = addDays(first, -dayOfWeek(first));
  let cellsHtml = "";
  for (let i=0;i<42;i++){
    const d = addDays(gridStart, i);
    const inMonth = d.slice(0,7)===state.monthCursor;
    const evs = eventsOnDate(state.eventsCache, d).filter(isRealEvent);
    const dn = inMonth ? dayNoteOf(d) : null;
    cellsHtml += `<td class="${inMonth?"":"out"} ${d===todayString()?"today":""}" ${inMonth?`data-mdate="${d}"`:""}>
      <strong>${Number(d.slice(8))}</strong> ${recDates.has(d)?`<span class="recdot" title="記録あり">●</span>`:""}
      <br>${evs.map(e=>`<span class="dot" style="background:${categoryColor(e.category)}" title="${esc(e.title)}"></span>`).join("")}
      ${dn&&dn.title?`<div class="daynote-mini">✎ ${esc(mask(dn.title)).slice(0,40)}</div>`:""}
    </td>`;
    if (i%7===6) cellsHtml += "</tr><tr>";
  }
  root.innerHTML = `
    <div class="rowflex"><button class="btn small ghost" id="mHome">🏠 ホーム</button></div>
    <h2 class="viewtitle">月間 ― ${cy}年${cm}月</h2>
    <div class="weeknav"><button class="btn small ghost" id="mPrev">◀ 前月</button>
    <button class="btn small ghost" id="mThis">今月</button><button class="btn small ghost" id="mNext">翌月 ▶</button></div>
    <table class="cal"><tr>${WEEKDAY_LABELS.map(w=>`<th>${w}</th>`).join("")}</tr><tr>${cellsHtml}</tr></table>
    <p class="muted">色ドット＝行事カテゴリ、<span class="recdot">●</span>＝記録あり。日をタップすると日エリアが開きます。</p>`;
  document.getElementById("mHome").onclick=()=>{ state.view="home"; render(); };
  document.getElementById("mPrev").onclick=()=>{ state.monthCursor = addMonths(first,-1).slice(0,7); render(); };
  document.getElementById("mNext").onclick=()=>{ state.monthCursor = addMonths(first,1).slice(0,7); render(); };
  document.getElementById("mThis").onclick=()=>{ state.monthCursor = todayString().slice(0,7); render(); };
  root.querySelectorAll("[data-mdate]").forEach(td=>td.onclick=()=>{ state.selectedDate = td.dataset.mdate; state.view="day"; render(); });
}

// ===== 年間ビュー =====
async function renderYear(root){
  const yid = state.currentYearId;
  const examEvents = state.eventsCache.filter(e=>e.category==="exam");
  const examDates = new Set();
  for (const e of examEvents){ let d = e.startDate; let guard=0; while (d<=e.endDate && guard++<370){ examDates.add(d); d = addDays(d,1); } }
  const termOf = (d)=>{ const t = termForDate(state.terms, d); return t ? t.name : ""; };
  const minis = academicMonths(yid).map(({year, month})=>{
    const first = formatDate(year, month, 1);
    const start = addDays(first, -dayOfWeek(first));
    let rows = "";
    for (let i=0;i<42;i++){
      const d = addDays(start, i);
      const inM = Number(d.slice(5,7))===month && Number(d.slice(0,4))===year;
      rows += `<td class="${inM?"has":""}" style="${examDates.has(d)&&inM?"background:#f3d9d9;font-weight:700":""}">${inM?Number(d.slice(8)):""}</td>`;
      if (i%7===6) rows += "</tr><tr>";
    }
    return `<div class="card" style="padding:10px"><strong>${month}月</strong> <span class="muted">${esc(termOf(first))}</span>
      <table class="cal minical"><tr>${rows}</tr></table></div>`;
  }).join("");
  let counters = "";
  for (const c of state.courses){
    const cnt = await countLessonsByCourse(c.id); // 件数カウントのみ（本体は読まない）
    const pct = c.standardHours>0 ? Math.min(100, Math.round(cnt/c.standardHours*100)) : 0;
    counters += `<div class="listitem" data-y-course="${c.id}"><span class="t">${esc(c.subject)} ${esc(c.name)}</span>（${esc(c.classLabel)}）
      <br>記録済み ${cnt} ／ 年間標準 ${c.standardHours} 時間（${pct}%）
      <div class="counterbar"><div style="width:${pct}%"></div></div></div>`;
  }
  root.innerHTML = `
    <div class="rowflex"><button class="btn small ghost" id="yHome">🏠 ホーム</button>
    <button class="btn small ghost" id="yAddEvent">＋ 行事・考査期間を追加</button></div>
    <h2 class="viewtitle">年間 ― ${yid}年度（4月〜3月）</h2>
    <h3 class="sect">学期・考査期間</h3>
    ${state.terms.map((t,i)=>`<div class="termband" style="background:${["#3b6ea5","#3d7a4e","#7a4b9e"][i%3]}">${esc(t.name)}：${esc(t.startDate)} 〜 ${esc(t.endDate)}</div>`).join("")}
    ${examEvents.map(e=>`<div class="termband" style="background:#a33b3b">考査：${esc(e.title)}（${esc(e.startDate)} 〜 ${esc(e.endDate)}）</div>`).join("")}
    <h3 class="sect">講座別カウンター（標準時数 vs 記録済みコマ数）</h3>
    ${counters || `<p class="muted">講座が未登録です。</p>`}
    <h3 class="sect">12か月ミニカレンダー（ピンク＝考査期間）</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">${minis}</div>`;
  document.getElementById("yHome").onclick=()=>{ state.view="home"; render(); };
  document.getElementById("yAddEvent").onclick=()=>openEventSheet(null, todayString());
  root.querySelectorAll("[data-y-course]").forEach(el=>el.onclick=()=>{ state.selectedCourseId = el.dataset.yCourse; state.view="course"; render(); });
}

// ===== 基本時間割エディタ（設定／ウィザード共用）=====
function slotEditorHTML(prefix){
  let h = `<table class="slotgrid"><tr><th></th>${[1,2,3,4,5,6].map(d=>`<th>${WEEKDAY_LABELS[d]}</th>`).join("")}</tr>`;
  for (const p of PERIODS){
    h += `<tr><td class="plabel" style="width:40px">${esc(p.label)}</td>`;
    for (let dow=1; dow<=6; dow++){
      const s = state.baseSlots.find(b=>b.dayOfWeek===dow && b.period===p.code);
      const sel = state.slotEdit && state.slotEdit.dow===dow && state.slotEdit.period===p.code;
      const txt = s ? (s.courseId ? esc((state.courses.find(c=>c.id===s.courseId)||{}).name||"授業") : esc(s.label || categoryLabelForKind(s.kind))) : "―";
      h += `<td class="${s?"filled":""} ${sel?"sel":""}" data-slot="${dow}#${p.code}">${txt}</td>`;
    }
    h += `</tr>`;
  }
  h += `</table><div id="${prefix}SlotForm"></div>`;
  return h;
}
function bindSlotEditor(root, prefix, rerender){
  root.querySelectorAll("[data-slot]").forEach(td=>td.onclick=()=>{
    const [dow, period] = td.dataset.slot.split("#").map(Number);
    state.slotEdit = { dow, period };
    rerender();
  });
  const form = root.querySelector(`#${prefix}SlotForm`);
  if (!form || !state.slotEdit) return;
  const { dow, period } = state.slotEdit;
  const cur = state.baseSlots.find(b=>b.dayOfWeek===dow && b.period===period) || { kind:"lesson", courseId:null, label:"" };
  form.innerHTML = `
    <div class="card" style="margin-top:12px"><strong>${WEEKDAY_LABELS[dow]}曜 ${esc(periodLabel(period))} の基本枠</strong>
    <label class="f">種別</label>
    <select class="t" id="${prefix}Kind">${[["lesson","授業"],["homeroom","SHR/LHR"],["club","部活"],["meeting","会議"],["duty","校務"],["other","その他"]].map(([v,l])=>`<option value="${v}" ${cur.kind===v?"selected":""}>${l}</option>`).join("")}</select>
    <label class="f">講座（授業の場合）</label>
    <select class="t" id="${prefix}Course"><option value="">（なし）</option>${state.courses.map(c=>`<option value="${c.id}" ${cur.courseId===c.id?"selected":""}>${esc(c.subject)} ${esc(c.name)}（${esc(c.classLabel)}）</option>`).join("")}</select>
    <label class="f">ラベル（部活・会議など）</label>
    <input class="t" id="${prefix}Label" value="${esc(cur.label||"")}" placeholder="例：学年会、サッカー部">
    <div class="rowflex" style="margin-top:12px"><button class="btn small gold" id="${prefix}Save">この枠を保存</button>
    ${cur.id?`<button class="btn small danger" id="${prefix}Del">この枠を削除</button>`:""}</div></div>`;
  form.querySelector(`#${prefix}Save`).onclick = async ()=>{
    const rec = { id: cur.id || uuid(), yearId: state.currentYearId, dayOfWeek: dow, period,
      kind: form.querySelector(`#${prefix}Kind`).value,
      courseId: form.querySelector(`#${prefix}Course`).value || null,
      label: form.querySelector(`#${prefix}Label`).value, level: 1 };
    await dbPut("baseSlots", rec);
    state.baseSlots = await getBaseSlotsByYear(state.currentYearId);
    toast("基本時間割を保存しました"); rerender();
  };
  const del = form.querySelector(`#${prefix}Del`);
  if (del) del.onclick = async ()=>{ await dbDelete("baseSlots", cur.id); state.baseSlots = await getBaseSlotsByYear(state.currentYearId); state.slotEdit=null; rerender(); };
}

    await dbPut("years", { id: yid, startDate: r.startDate, endDate: r.endDate, termSystem: sys, archived: false });
    for (const t of defaultTerms(yid, sys)) await dbPut("terms", t);
    state.years = (await dbGetAll("years")).sort((a,b)=>a.id-b.id);
    state.currentYearId = yid; saveSettings({ currentYearId: yid });
    await loadYearData(); toast(`${yid}年度を作成しました`); render();
  };
  root.querySelectorAll("[data-term-save]").forEach(b=>b.onclick=async ()=>{
    const t = state.terms.find(x=>x.id===b.dataset.termSave);
    t.startDate = document.getElementById(`ts-${t.id}`).value || t.startDate;
    t.endDate = document.getElementById(`te-${t.id}`).value || t.endDate;
    await dbPut("terms", t); toast("学期を保存しました"); render();
  });
  document.getElementById("addCourse").onclick = async ()=>{
    const rec = { id: uuid(), yearId: state.currentYearId,
      subject: document.getElementById("ncSubject").value.trim(), name: document.getElementById("ncName").value.trim(),
      classLabel: document.getElementById("ncClass").value.trim(),
      weeklyPeriods: Number(document.getElementById("ncWeekly").value)||0,
      standardHours: Number(document.getElementById("ncHours").value)||0, level: 1 };
    if (!rec.name){ toast("講座名を入力してください"); return; }
    await dbPut("courses", rec); state.courses = await getCoursesByYear(state.currentYearId);
    toast("講座を追加しました"); render();
  };
  root.querySelectorAll("[data-course-del]").forEach(b=>b.onclick=async ()=>{
    await dbDelete("courses", b.dataset.courseDel);
    state.courses = await getCoursesByYear(state.currentYearId); render();
  });
  root.querySelectorAll("[data-course-group]").forEach(sel=>sel.addEventListener("change", async ()=>{
    const c = state.courses.find(x=>x.id===sel.dataset.courseGroup);
    if (!c) return;
    c.groupId = sel.value || null;
    await dbPut("courses", c);
    toast("名簿グループを保存しました");
  }));
  bindSlotEditor(root, "set", ()=>renderSettings(root));
  document.getElementById("changePin").onclick = async ()=>{
    const cur = document.getElementById("pinCur").value;
    const nw = document.getElementById("pinNew").value;
    const msg = document.getElementById("pinMsg");
    if (!isValidPin(nw)){ msg.textContent = "新しいPINは4〜6桁の数字にしてください。"; return; }
    const key = await deriveKey(cur, state.security.salt, state.security.iterations);
    if (!(await verifyKeyCheck(key, state.security.keyCheck))){ msg.textContent = "現在のPINが違います。"; return; }
    const made = await createSecurity(nw);
    state.security = made.rec; state.key = made.key;
    msg.textContent = "PINを変更しました。";
  };
  document.getElementById("autoLockSel").onchange = (e)=>{ saveSettings({ autoLockMin: Number(e.target.value) }); toast(`自動ロックを ${e.target.value} 分に設定しました`); };
  document.getElementById("privacyDefault").onchange = (e)=>{ saveSettings({ privacyDefault: e.target.checked }); };
  document.getElementById("csvEnabled").onchange = (e)=>{
    if (!e.target.checked){ saveSettings({ csvEnabled: false }); toast("CSV出力を OFF にしました"); return; }
    e.target.checked = false; // 照合が通るまで ON にしない
    openSheet(`
      <h3 class="sect" style="margin-top:0">CSV出力を有効にしますか</h3>
      <div class="warnbox"><strong>警告：</strong>CSV は暗号化されていない平文ファイルです。書き出したファイルは端末に残り、他のアプリから読まれる可能性があります。転記が済んだらファイル自体を削除してください。</div>
      <p>有効化には現在の PIN の再入力が必要です。</p>
      <label class="f">現在のPIN</label>
      <input class="t" id="csvPin" type="password" inputmode="numeric" maxlength="6" style="font-size:22px;max-width:220px">
      <div class="lockmsg" id="csvPinMsg"></div>
      <div class="rowflex" style="margin-top:12px">
        <button class="btn gold" id="csvPinOk">PINを照合して有効化</button>
        <button class="btn ghost" id="csvPinCancel">やめる</button></div>`);
    document.getElementById("csvPinCancel").onclick = ()=>closeSheet();
    document.getElementById("csvPinOk").onclick = async ()=>{
      const pin = document.getElementById("csvPin").value;
      const key = await deriveKey(pin, state.security.salt, state.security.iterations);
      if (!(await verifyKeyCheck(key, state.security.keyCheck))){
        document.getElementById("csvPinMsg").textContent = "PINが違います。有効化しませんでした。";
        return;
      }
      saveSettings({ csvEnabled: true });
      closeSheet(); toast("CSV出力を有効にしました"); render();
    };
  };
  document.getElementById("updateBtn").onclick = ()=>{
    const url = new URL(location.href); url.searchParams.set("v", Date.now());
    location.replace(url.toString());
  };
}

// ===== 初回ウィザード =====
function startWizard(step){
  document.getElementById("lockScreen").classList.add("hidden");
  document.getElementById("appHeader").classList.add("hidden");
  document.getElementById("viewRoot").classList.add("hidden");
  document.getElementById("wizardScreen").classList.remove("hidden");
  state.wizard = { step: step || 1 };
  renderWizard();
}
function wizHead(step, title){
  return `<div class="logotitle"><div class="big" style="font-size:30px">KyomuNote</div>
  <div class="sub">デジタル教務手帳 ― 初回セットアップ</div></div>
  <p class="wizstep">ステップ ${step} / 4</p><h2 class="viewtitle">${title}</h2>`;
}
function renderWizard(){
  const box = document.getElementById("wizardBox");
  const w = state.wizard;
  if (w.step===1){
    box.innerHTML = `${wizHead(1,"PINを設定しましょう")}
      <p>アプリを開くためのPIN（数字4〜6桁）を決めてください。<strong>6桁がおすすめ</strong>です。PINは端末の外に出ません。</p>

      <button class="btn gold" id="wzNext1" style="width:100%;margin-top:10px">次へ ― 年度の作成</button>`;

      const p1 = document.getElementById("wzPin").value, p2 = document.getElementById("wzPin2").value;
      if (!isValidPin(p1)){ document.getElementById("wzMsg").textContent = "PINは数字4〜6桁にしてください。"; return; }
      if (p1!==p2){ document.getElementById("wzMsg").textContent = "確認用PINが一致しません。"; return; }
      const made = await createSecurity(p1);
      state.security = made.rec; state.key = made.key; state.unlocked = true;
      w.step = 2; renderWizard();
    };
    return;
  }
  if (w.step===2){
    const defYear = academicYearOf(todayString());
    box.innerHTML = `${wizHead(2,"年度を作成しましょう")}
      <label class="f">年度</label>
      <select class="t" id="wzYear">${[defYear-1,defYear,defYear+1].map(y=>`<option value="${y}" ${y===defYear?"selected":""}>${y}年度（${y}年4月〜${y+1}年3月）</option>`).join("")}</select>
      <label class="f">学期制</label>
      <select class="t" id="wzSystem"><option value="3">3学期制</option><option value="2">2期制（前期・後期）</option></select>
      <p class="muted">学期の日付は既定の日付で自動作成します。あとから設定画面でいつでも調整できます。</p>
      <button class="btn gold" id="wzNext2" style="width:100%;margin-top:10px">次へ ― 講座の登録</button>`;
    document.getElementById("wzNext2").onclick = async ()=>{
      const yid = Number(document.getElementById("wzYear").value);
      const sys = document.getElementById("wzSystem").value;
      const r = yearRange(yid);
      await dbPut("years", { id: yid, startDate: r.startDate, endDate: r.endDate, termSystem: sys, archived: false });
      for (const t of defaultTerms(yid, sys)) await dbPut("terms", t);
      state.years = (await dbGetAll("years")).sort((a,b)=>a.id-b.id);
      state.currentYearId = yid; saveSettings({ currentYearId: yid });
      await loadYearData();
      w.step = 3; renderWizard();
    };
    return;
  }
  if (w.step===3){
    box.innerHTML = `${wizHead(3,"担当講座を登録しましょう")}
      <p class="muted">複数追加できます。あとから設定画面でも追加・変更できます。</p>
      <div id="wzCourseList">${state.courses.map(c=>`<div class="listitem"><span class="t">${esc(c.subject)} ${esc(c.name)}</span>（${esc(c.classLabel)}）週${c.weeklyPeriods}コマ／標準${c.standardHours}時間</div>`).join("") || `<p class="muted">まだ登録がありません。</p>`}</div>
      <label class="f">教科</label><input class="t" id="wzSubject" placeholder="数学">
      <label class="f">講座名</label><input class="t" id="wzName" placeholder="数学I">
      <label class="f">クラス</label><input class="t" id="wzClass" placeholder="2年A組">
      <div class="rowflex"><div style="flex:1"><label class="f">週コマ数</label><input class="t" id="wzWeekly" type="number" value="4"></div>
      <div style="flex:1"><label class="f">年間標準時数</label><input class="t" id="wzHours" type="number" value="140"></div></div>
      <div class="rowflex" style="margin-top:14px"><button class="btn ghost" id="wzAddCourse">＋ 講座を追加</button>
      <button class="btn gold" id="wzNext3" style="flex:1">次へ ― 基本時間割の登録</button></div>`;
    document.getElementById("wzAddCourse").onclick = async ()=>{
      const rec = { id: uuid(), yearId: state.currentYearId,
        subject: document.getElementById("wzSubject").value.trim(), name: document.getElementById("wzName").value.trim(),
        classLabel: document.getElementById("wzClass").value.trim(),
        weeklyPeriods: Number(document.getElementById("wzWeekly").value)||0,
        standardHours: Number(document.getElementById("wzHours").value)||0, level: 1 };
      if (!rec.name){ toast("講座名を入力してください"); return; }
      await dbPut("courses", rec); state.courses = await getCoursesByYear(state.currentYearId);
      renderWizard();
    };
    document.getElementById("wzNext3").onclick = ()=>{ w.step = 4; renderWizard(); };
    return;
  }
  // step 4
  box.innerHTML = `${wizHead(4,"基本時間割を登録しましょう")}
    <p class="muted">表のマスをタップして、種別・講座・ラベルを設定してください。あとから設定画面でも編集できます。</p>
    <div style="overflow-x:auto">${slotEditorHTML("wz")}</div>
    <button class="btn gold" id="wzFinish" style="width:100%;margin-top:16px;font-size:20px;padding:16px">完了してホームへ</button>`;
  bindSlotEditor(box, "wz", renderWizard);
  document.getElementById("wzFinish").onclick = async ()=>{
    document.getElementById("wizardScreen").classList.add("hidden");
    state.slotEdit = null;
    await enterApp();
  };
}


// ===== 第2期 共通ヘルパー =====
function backHomeBtn(id){ return `<button class="btn small ghost" id="${id}">🏠 ホーム</button>`; }
function bindHome(id){ const el=document.getElementById(id); if(el) el.onclick=()=>{ state.view="home"; render(); }; }
function courseOptions(selectedId){
  return `<option value="">（講座を選ぶ）</option>` + state.courses.map(c=>`<option value="${c.id}" ${selectedId===c.id?"selected":""}>${esc(c.subject)} ${esc(c.name)}（${esc(c.classLabel)}）</option>`).join("");
}
function groupOptions(selectedId){
  return `<option value="">（グループを選ぶ）</option>` + state.groups.map(g=>`<option value="${g.id}" ${selectedId===g.id?"selected":""}>${esc(g.name)}</option>`).join("");
}
function viewpointOptions(selected){
  return [`<option value="none" ${selected==="none"?"selected":""}>（観点なし）</option>`]
    .concat(VIEWPOINTS.map(v=>`<option value="${v.id}" ${selected===v.id?"selected":""}>${esc(v.label)}</option>`)).join("");
}
async function addObservation(studentId, courseId, lessonId, text, viewpoint){
  if (!text || !text.trim()){ toast("所見メモの本文を入力してください"); return false; }
  await putEnc("observations",
    { id: uuid(), studentId, courseId: courseId||null, lessonId: lessonId||null, date: todayString(), yearId: state.currentYearId },
    { text: text.trim(), viewpoint: viewpoint||"none", source: "" });
  return true;
}
async function reloadStudents(){
  const raw = await getStudentsByYear(state.currentYearId);
  state.students = [];
  for (const r of raw) state.students.push(await decryptMerge(r));
}
async function reloadMemberships(){
  state.memberships = [];
  for (const g of state.groups){
    const ms = await getMembershipsByGroup(g.id);
    for (const m of ms) state.memberships.push(m);
  }
}
async function saveStudentBody(student, bodyPatch){
  const cur = { name: student.name, kana: student.kana, displayLabel: student.displayLabel, memo: student.memo };
  const body = Object.assign({}, cur, bodyPatch||{});
  // undefined の項目は持たない（initials運用で氏名を保存しないための表現）
  for (const k of Object.keys(body)) if (body[k]===undefined) delete body[k];
  await putEnc("students", { id: student.id, yearId: student.yearId }, body);
  Object.assign(student, body);
  if (bodyPatch && bodyPatch.name===undefined && ("name" in (bodyPatch||{}))){}
  return student;
}

// ===== 名簿（roster）=====
async function renderRoster(root){
  const groups = state.groups;
  const sel = groups.find(g=>g.id===state.selectedGroupId) || null;
  let h = `<div class="rowflex">${backHomeBtn("rHome")}<button class="btn small ghost" id="rSeats">💺 座席表へ</button></div>
  <h2 class="viewtitle">名簿 ― ${state.currentYearId}年度</h2>`;
  h += `<h3 class="sect">グループ一覧</h3>`;
  if (!groups.length) h += `<div class="card">グループがまだありません。下のフォームから作成してください。</div>`;
  h += groups.map(g=>{
    const n = state.memberships.filter(m=>m.groupId===g.id).length;
    return `<div class="listitem" data-rgroup="${g.id}"><span class="t">${esc(g.name)}</span>
      <span class="muted">種別：${g.kind==="course"?"講座グループ":"学級"} ／ 運用：${g.rosterMode==="initials"?"イニシャル／番号のみ":"氏名"} ／ ${n}名</span>
      <div class="rowflex" style="margin-top:6px"><button class="btn small gold" data-rgroup-open="${g.id}">名簿を開く</button>
      <button class="btn small ghost" data-rgroup-seats="${g.id}">座席表</button></div></div>`;
  }).join("");
  h += `<div class="card"><h3 class="sect" style="margin-top:0">グループを作成</h3>
    <label class="f">名前</label><input class="t" id="rgName" placeholder="例：2年A組／数学I・選択α">
    <label class="f">種別</label><select class="t" id="rgKind"><option value="class">学級</option><option value="course">講座グループ</option></select>
    <label class="f">講座（種別が「講座グループ」のとき）</label><select class="t" id="rgCourse">${courseOptions(null)}</select>
    <label class="f">運用モード</label><select class="t" id="rgMode"><option value="full">氏名を保存する（full）</option><option value="initials">イニシャル／番号のみ（initials・氏名は保存しません）</option></select>
    <button class="btn gold" id="rgCreate" style="margin-top:12px">グループを作成</button></div>`;

  if (sel){
    const members = groupMembers(sel.id);
    const others = state.students.filter(st=>!state.memberships.some(m=>m.groupId===sel.id && m.studentId===st.id));
    h += `<div class="card"><h3 class="sect" style="margin-top:0">名簿編集 ― ${esc(sel.name)}</h3>
    <p class="muted">種別：${sel.kind==="course"?"講座グループ":"学級"} ／ 運用モード：${sel.rosterMode==="initials"?"イニシャル／番号のみ":"氏名"}</p>
    <label class="f">運用モードの切替</label>
    <div class="rowflex"><select class="t" id="rgModeSel" style="max-width:320px">
      <option value="full" ${sel.rosterMode==="full"?"selected":""}>氏名を保存する（full）</option>
      <option value="initials" ${sel.rosterMode==="initials"?"selected":""}>イニシャル／番号のみ（initials）</option></select>
    <button class="btn small" id="rgModeApply">切り替える</button></div>
    <h3 class="sect">所属生徒（出席番号順）</h3>`;
    if (!members.length) h += `<p class="muted">所属生徒はまだいません。</p>`;
    h += members.map(({membership:m, student:st})=>{
      return `<div class="listitem" style="cursor:default">
        <div class="rowflex">
          <span>番号 <input class="t smallnum" type="number" data-mem-no="${st.id}" value="${m.no==null?"":m.no}" style="max-width:80px"></span>
          ${sel.rosterMode==="full"?`<span style="flex:1;min-width:150px">氏名 <input class="t" data-mem-name="${st.id}" value="${esc(st.name||"")}"></span>
          <span style="flex:1;min-width:130px">ふりがな <input class="t" data-mem-kana="${st.id}" value="${esc(st.kana||"")}"></span>`:""}
          <span style="flex:1;min-width:120px">イニシャル <input class="t" data-mem-label="${st.id}" value="${esc(st.displayLabel||"")}"></span>
          <button class="btn small ghost" data-mem-page="${st.id}">生徒ページ</button>
          <button class="btn small danger" data-mem-remove="${st.id}">所属を外す</button>
        </div></div>`;
    }).join("");
    h += `<h3 class="sect">生徒を追加</h3>
      ${sel.rosterMode==="full"
        ? `<label class="f">氏名</label><input class="t" id="raName" placeholder="氏名">
           <label class="f">ふりがな</label><input class="t" id="raKana" placeholder="ふりがな">`
        : `<p class="muted">このグループはイニシャル運用です。氏名・ふりがなは入力欄自体がなく、保存もされません。</p>`}
      <label class="f">イニシャル／コードネーム</label><input class="t" id="raLabel" placeholder="例：S.T">
      <label class="f">出席番号</label><input class="t" id="raNo" type="number" style="max-width:120px" value="${members.length? (Math.max(...members.map(x=>Number(x.membership.no)||0))+1) : 1}">
      <div style="margin-top:10px"><button class="btn gold" id="raAdd">この生徒を追加</button></div>
      ${others.length?`<h3 class="sect">既存の生徒を追加</h3>
      <div class="rowflex"><select class="t" id="raExisting" style="flex:1">${others.map(st=>{
        const g0 = state.memberships.find(m=>m.studentId===st.id);
        return `<option value="${st.id}">${esc(displayNameOf(st, g0?g0.groupId:null))}</option>`;}).join("")}</select>
      <button class="btn" id="raAddExisting">選んで追加</button></div>`:""}
    </div>`;

  root.innerHTML = h;

  document.getElementById("rSeats").onclick = ()=>{ state.view="seats"; render(); };
  root.querySelectorAll("[data-rgroup-open]").forEach(b=>b.onclick=()=>{ state.selectedGroupId=b.dataset.rgroupOpen; render(); });
  root.querySelectorAll("[data-rgroup-seats]").forEach(b=>b.onclick=()=>{ state.selectedGroupId=b.dataset.rgroupSeats; state.view="seats"; render(); });
  document.getElementById("rgCreate").onclick = async ()=>{
    const name = document.getElementById("rgName").value.trim();
    if (!name){ toast("グループ名を入力してください"); return; }
    const kind = document.getElementById("rgKind").value;
    const courseId = document.getElementById("rgCourse").value || null;
    const g = { id: uuid(), yearId: state.currentYearId, kind, name,
      courseId: kind==="course" ? courseId : null,
      rosterMode: document.getElementById("rgMode").value, level: 1 };
    await dbPut("groups", g);
    state.groups.push(g);
    if (kind==="course" && courseId){
      const c = state.courses.find(x=>x.id===courseId);
      if (c){ c.groupId = g.id; await dbPut("courses", c); }
    }
    state.selectedGroupId = g.id;
    toast("グループを作成しました"); render();
  };
  if (!sel) return;
  // 名簿編集の自動保存（change時）
  root.querySelectorAll("[data-mem-no]").forEach(el=>el.addEventListener("change", async ()=>{
    const m = state.memberships.find(x=>x.groupId===sel.id && x.studentId===el.dataset.memNo);
    if (!m) return;
    m.no = Number(el.value);
    await dbPut("memberships", m);
    toast("出席番号を保存しました"); render();
  }));
  const bindStudentField = (attr, field)=>{
    root.querySelectorAll(`[${attr}]`).forEach(el=>el.addEventListener("change", async ()=>{
      const st = studentById(el.getAttribute(attr));
      if (!st) return;
      const patch = {}; patch[field] = el.value;
      await saveStudentBody(st, patch);
      toast("保存しました");
    }));
  };
  bindStudentField("data-mem-name","name");
  bindStudentField("data-mem-kana","kana");
  bindStudentField("data-mem-label","displayLabel");
  root.querySelectorAll("[data-mem-remove]").forEach(b=>b.onclick=async ()=>{
    await dbDelete("memberships", [sel.id, b.dataset.memRemove]);
    state.memberships = state.memberships.filter(m=>!(m.groupId===sel.id && m.studentId===b.dataset.memRemove));
    toast("所属を外しました（生徒の記録自体は残ります）"); render();
  });
  root.querySelectorAll("[data-mem-page]").forEach(b=>b.onclick=()=>{ state.selectedStudentId=b.dataset.memPage; state.view="student"; render(); });
  document.getElementById("raAdd").onclick = async ()=>{
    const label = document.getElementById("raLabel").value.trim();
    const body = { displayLabel: label, memo: "" };
    if (sel.rosterMode==="full"){
      body.name = document.getElementById("raName").value.trim();
      body.kana = document.getElementById("raKana").value.trim();
      if (!body.name && !label){ toast("氏名かイニシャルを入力してください"); return; }
    } else {
      if (!label){ toast("イニシャルを入力してください"); return; }
    }
    const st = { id: uuid(), yearId: state.currentYearId };
    await putEnc("students", { id: st.id, yearId: st.yearId }, body);
    const full = Object.assign({}, st, body);
    state.students.push(full);
    const m = { groupId: sel.id, studentId: st.id, no: Number(document.getElementById("raNo").value)||null, yearId: state.currentYearId };
    await dbPut("memberships", m);
    state.memberships.push(m);
    toast("生徒を追加しました"); render();
  };
  const addEx = document.getElementById("raAddExisting");
  if (addEx) addEx.onclick = async ()=>{
    const sid = document.getElementById("raExisting").value;
    if (!sid) return;
    const nos = groupMembers(sel.id).map(x=>Number(x.membership.no)||0);
    const m = { groupId: sel.id, studentId: sid, no: (nos.length?Math.max(...nos):0)+1, yearId: state.currentYearId };
    await dbPut("memberships", m);
    state.memberships.push(m);
    toast("既存の生徒を追加しました"); render();
  };
  document.getElementById("rgModeApply").onclick = async ()=>{
    const target = document.getElementById("rgModeSel").value;
    if (target===sel.rosterMode){ toast("すでにそのモードです"); return; }
    if (target==="full"){
      sel.rosterMode = "full"; await dbPut("groups", sel);
      toast("氏名モードに切り替えました"); render(); return;
    }
    // full -> initials：確認シートつき
    openSheet(`
      <h3 class="sect" style="margin-top:0">イニシャル運用へ切り替えますか</h3>
      <div class="warnbox"><strong>氏名・ふりがなが消える操作です。</strong><br>
      このグループをイニシャル運用に切り替えると、このグループだけに所属する生徒（他の氏名グループに所属していない生徒）の<strong>氏名・ふりがなを消去</strong>します。元に戻せません。<br>
      他に氏名モードのグループへ所属している生徒の氏名は消えません。</div>
      <div class="rowflex"><button class="btn danger" id="modeConfirm">氏名を消去して切り替える</button>
      <button class="btn ghost" id="modeCancel">やめる</button></div>`);
    document.getElementById("modeCancel").onclick = ()=>closeSheet();
    document.getElementById("modeConfirm").onclick = async ()=>{
      sel.rosterMode = "initials"; await dbPut("groups", sel);
      const memberIds = [...new Set(state.memberships.filter(m=>m.groupId===sel.id).map(m=>m.studentId))];
      for (const sid of memberIds){
        const myGroups = state.memberships.filter(m=>m.studentId===sid).map(m=>m.groupId);
        const allInitials = myGroups.every(gid=>{
          const g = state.groups.find(x=>x.id===gid);
          return g && g.rosterMode==="initials";
        });
        if (allInitials){
          const st = studentById(sid);
          if (st && (st.name || st.kana)){
            await putEnc("students", { id: st.id, yearId: st.yearId }, { displayLabel: st.displayLabel||"", memo: st.memo||"" });
            delete st.name; delete st.kana;
          }
        }
      }
      closeSheet(); toast("イニシャル運用に切り替えました"); render();
    };
  };
}

async function loadSeatPlans(groupId, kind){
  const raw = await getSeatPlansByGroup(groupId);
  const out = [];
  for (const r of raw) if (r.kind===kind) out.push(await decryptMerge(r));
  return out.sort((a,b)=> a.effectiveFrom<b.effectiveFrom?1:-1);
}
async function renderSeats(root){

  if (!state.selectedGroupId && groups.length) state.selectedGroupId = groups[0].id;
  const group = groups.find(g=>g.id===state.selectedGroupId) || null;

  if (group){

    <div class="rowflex" style="margin-top:10px">
      <button class="btn small ${state.seatEditMode?"gold":"ghost"}" id="seModeToggle">${state.seatEditMode?"編集中（タップで割当）":"閲覧モード（タップでクイックパネル）"}</button>

      <label style="font-size:15px"><input type="checkbox" id="seFlip" ${flip?"checked":""} style="width:22px;height:22px;vertical-align:middle"> 前後反転（教卓側を下に）</label>
    </div>
    <h3 class="sect">新しい配置を作る</h3>
    <div class="rowflex">
      <span>行 <input class="t smallnum" type="number" id="spRows" value="6"></span>
      <span>列 <input class="t smallnum" type="number" id="spCols" value="6"></span>
      <span style="flex:1;min-width:160px">名前 <input class="t" id="spName" placeholder="例：5月・通常配置"></span>
      <span>有効開始日 <input class="t" type="date" id="spFrom" value="${todayString()}" style="max-width:180px"></span>
      <button class="btn small gold" id="spCreate">配置を作成</button>
    </div></div>`;
  } else {
    h += `<p class="muted">グループがありません。名簿でグループを作成してください。</p></div>`;
  }
  if (group && plan){
    const seats = plan.seats || {}, nonSeats = plan.nonSeats || [];
    const rowIdx = [];
    for (let r=0;r<plan.rows;r++) rowIdx.push(r);
    const dispRows = flip ? rowIdx.slice().reverse() : rowIdx;
    h += `<div class="card"><h3 class="sect" style="margin-top:0">${esc(plan.name||"配置")}（${plan.kind==="exam"?"考査":"通常"}・${esc(plan.effectiveFrom)}〜）</h3>
    <p class="muted">${flip?"教卓は下側です":"教卓は上側です"}${state.seatSwapMode?" ／ 入れ替えモード：2つのセルを順にタップしてください":""}</p>
    <div class="seatgrid" style="grid-template-columns:repeat(${plan.cols},1fr)">`;
    for (const r of dispRows){
      for (let c=0;c<plan.cols;c++){
        const key = seatKey(r,c);
        const isNon = nonSeats.includes(key);
        const sid = seats[key];
        const st = sid ? studentById(sid) : null;
        const label = isNon ? "（座席なし）" : (st ? esc(displayNameOf(st, group.id)) : "空席");
        const cls = isNon ? "nonseat" : (st ? "" : "empty");
        const swapCls = state.seatSwapFirst===key ? " swap1" : "";
        h += `<div class="seatcell ${cls}${swapCls}" data-seat="${key}">${label}<br><span class="muted" style="font-size:11px">${key}</span></div>`;
      }
    }
    h += `</div></div>`;
  } else if (group){
    h += `<div class="card">この種別の配置はまだありません。「新しい配置を作る」から作成してください。</div>`;
  }
  root.innerHTML = h;
  bindHome("seHome");
  document.getElementById("seRoster").onclick = ()=>{ state.view="roster"; render(); };
  document.getElementById("seGroup").onchange = (e)=>{ state.selectedGroupId=e.target.value||null; state.seatPlanId=null; render(); };
  root.querySelectorAll("#seKind button").forEach(b=>b.onclick=()=>{ state.seatKind=b.dataset.kind; state.seatPlanId=null; render(); });
  if (!group) return;
  const planSel = document.getElementById("sePlan");
  if (planSel) planSel.onchange = (e)=>{ state.seatPlanId=e.target.value||null; render(); };
  document.getElementById("seModeToggle").onclick = ()=>{ state.seatEditMode=!state.seatEditMode; render(); };
  document.getElementById("seSwapToggle").onclick = ()=>{ state.seatSwapMode=!state.seatSwapMode; state.seatSwapFirst=null; render(); };
  document.getElementById("seFlip").onchange = (e)=>{ saveSettings({ seatFlip: e.target.checked }); render(); };
  document.getElementById("spCreate").onclick = async ()=>{
    const rows = Math.max(1, Number(document.getElementById("spRows").value)||1);
    const cols = Math.max(1, Number(document.getElementById("spCols").value)||1);
    const rec = { id: uuid(), groupId: group.id, yearId: state.currentYearId, kind: state.seatKind,
      name: document.getElementById("spName").value.trim() || "配置",
      effectiveFrom: document.getElementById("spFrom").value || todayString(), rows, cols };
    await putEnc("seatPlans", rec, { seats: {}, nonSeats: [] });
    state.seatPlanId = rec.id;
    toast("配置を作成しました"); render();
  };
  if (!plan) return;
  const savePlan = async (seats, nonSeats)=>{
    await putEnc("seatPlans",
      { id: plan.id, groupId: plan.groupId, yearId: plan.yearId, kind: plan.kind, name: plan.name, effectiveFrom: plan.effectiveFrom, rows: plan.rows, cols: plan.cols },
      { seats, nonSeats });
  };
  root.querySelectorAll("[data-seat]").forEach(cell=>cell.addEventListener("click", async ()=>{
    const key = cell.dataset.seat;
    const seats = Object.assign({}, plan.seats||{});

    if (state.seatSwapMode){
      if (!state.seatSwapFirst){ state.seatSwapFirst = key; render(); return; }
      const first = state.seatSwapFirst;
      const a = seats[first], b = seats[key];
      if (b) seats[first]=b; else delete seats[first];
      if (a) seats[key]=a; else delete seats[key];
      state.seatSwapFirst = null;
      await savePlan(seats, nonSeats);
      toast("座席を入れ替えました"); render(); return;
    }
    if (state.seatEditMode){
      const members = groupMembers(group.id);
      openSheet(`
        <h3 class="sect" style="margin-top:0">座席 ${esc(key)} の割当</h3>
        ${nonSeats.includes(key)?`<p class="muted">このセルは現在「座席でないセル」です。</p>`:""}
        <div style="display:grid;gap:8px">
        ${members.map(({student:st})=>`<button class="btn ghost" data-asn="${st.id}">${esc(displayNameOf(st, group.id))}</button>`).join("")}
        <button class="btn" id="asnEmpty">空席にする</button>
        ${nonSeats.includes(key)?`<button class="btn" id="asnSeat">座席に戻す</button>`:`<button class="btn" id="asnNon">座席でないセルにする</button>`}
        <button class="btn small ghost" id="asnCancel">キャンセル</button></div>`);
      document.getElementById("asnCancel").onclick = ()=>closeSheet();
      root.ownerDocument.querySelectorAll("[data-asn]").forEach(b=>b.onclick=async ()=>{
        seats[key] = b.dataset.asn;
        await savePlan(seats, nonSeats.filter(k=>k!==key));
        closeSheet(); toast("割り当てました"); render();
      });
      document.getElementById("asnEmpty").onclick = async ()=>{ delete seats[key]; await savePlan(seats, nonSeats); closeSheet(); render(); };
      const asnNon = document.getElementById("asnNon");
      if (asnNon) asnNon.onclick = async ()=>{ delete seats[key]; await savePlan(seats, [...new Set(nonSeats.concat([key]))]); closeSheet(); render(); };
      const asnSeat = document.getElementById("asnSeat");
      if (asnSeat) asnSeat.onclick = async ()=>{ await savePlan(seats, nonSeats.filter(k=>k!==key)); closeSheet(); render(); };
      return;
    }
    // 閲覧モード：クイックパネル
    const sid = seats[key];
    if (!sid || nonSeats.includes(key)){ toast("空席です（編集は「編集中」に切り替えてください）"); return; }
    openSeatQuickPanel(group, sid);
  }));
}
async function openSeatQuickPanel(group, studentId){
  const st = studentById(studentId);
  if (!st) return;
  const today = todayString();
  const cells = await buildDayCells(today);
  const groupCourses = state.courses.filter(c=>c.groupId===group.id || group.courseId===c.id);
  const myCells = cells.filter(c=>c.courseId && groupCourses.some(x=>x.id===c.courseId));
  let attHtml = "";
  for (const c of myCells){
    const lessonId = lessonKey(today, c.period);
    const rec = await getEnc("attendance", lessonId);
    const cur = rec && rec.marks && rec.marks[studentId] ? rec.marks[studentId].status : null;
    attHtml += `<div class="listitem" style="cursor:default"><span class="t">${esc(periodLabel(c.period))} ${esc(cellTitle(c))}</span>
      現在：${cur?esc(attendanceStatusLabel(cur)):"出席"}
      <div class="statusseg" style="margin-top:6px">
        <button data-qp-clear="${lessonId}">出席に戻す</button>
        ${ATTENDANCE_STATUSES.map(x=>`<button data-qp-lid="${lessonId}" data-qp-status="${x.id}" class="${cur===x.id?"on":""}">${x.label}</button>`).join("")}
      </div></div>`;
  }
  openSheet(`
    <h3 class="sect" style="margin-top:0">${esc(displayNameOf(st, group.id))} ― クイックパネル</h3>
    <p class="muted">${esc(group.name)} ／ ${today} の出欠</p>
    ${attHtml || `<p class="muted">今日このグループの講座のコマはありません。</p>`}
    <h3 class="sect">所見メモを追加</h3>
    <textarea class="t" id="qpObsText" placeholder="授業中の気づき・活躍など"></textarea>
    <label class="f">観点タグ</label><select class="t" id="qpObsView">${viewpointOptions("none")}</select>
    <div class="rowflex" style="margin-top:12px">
      <button class="btn gold" id="qpObsAdd">所見メモを保存</button>
      <button class="btn" id="qpGoStudent">生徒ページへ</button>
      <button class="btn ghost" id="qpClose">閉じる</button></div>`);
  document.getElementById("qpClose").onclick = ()=>closeSheet();
  document.getElementById("qpGoStudent").onclick = ()=>{ closeSheet(); state.selectedStudentId=studentId; state.view="student"; render(); };
  document.getElementById("qpObsAdd").onclick = async ()=>{
    const ok = await addObservation(studentId, group.courseId||null, null,
      document.getElementById("qpObsText").value, document.getElementById("qpObsView").value);
    if (ok){ toast("所見メモを保存しました"); closeSheet(); }
  };
  const setAtt = async (lessonId, status)=>{
    const lesson = await getOrDraftLesson(today, Number(lessonId.split("#")[1]));
    const course = state.courses.find(c=>c.id===lesson.courseId);
    const grp = course ? courseGroup(course) : group;
    const rec = await getEnc("attendance", lessonId);
    const marks = Object.assign({}, rec && rec.marks ? rec.marks : {});
    if (status) marks[studentId] = { status, memo: (marks[studentId]&&marks[studentId].memo)||"" };
    else delete marks[studentId];
    await putEnc("attendance",
      { id: lessonId, date: today, yearId: state.currentYearId, courseId: lesson.courseId||null, groupId: grp?grp.id:group.id },
      { marks, note: (rec && rec.note) || "" });
    toast("出欠を保存しました");
    openSeatQuickPanel(group, studentId);
  };
  document.querySelectorAll("[data-qp-status]").forEach(b=>b.onclick=()=>setAtt(b.dataset.qpLid, b.dataset.qpStatus));
  document.querySelectorAll("[data-qp-clear]").forEach(b=>b.onclick=()=>setAtt(b.dataset.qpClear, null));
}

      const el = document.getElementById("ckNoteSaved");
      if (el) el.textContent = "保存済み " + new Date().toLocaleTimeString("ja-JP");
    });
  }
  const obsAdd = document.getElementById("ckObsAdd");
