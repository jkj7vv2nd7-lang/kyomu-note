  document.getElementById("rgCreate").onclick = async ()=>{

    const courseId = document.getElementById("rgCourse").value || null;
    const g = { id: uuid(), yearId: state.currentYearId, kind, name,
      courseId: kind==="course" ? courseId : null,
      rosterMode: document.getElementById("rgMode").value, level: 1 };
    await dbPut("groups", g);
    state.groups.push(g);
    if (kind==="course" && courseId){
      const c = state.courses.find(x=>x.id===courseId);
      if (c){ c.groupId = g.id; await dbPut("courses", c); }
    }
    state.selectedGroupId = g.id;
    toast("グループを作成しました"); render();
  };
  if (!sel) return;
  // 名簿編集の自動保存（change時）

    m.no = Number(el.value);
    await dbPut("memberships", m);
    toast("出席番号を保存しました"); render();

  const bindStudentField = (attr, field)=>{
    root.querySelectorAll(`[${attr}]`).forEach(el=>el.addEventListener("change", async ()=>{
      const st = studentById(el.getAttribute(attr));
      if (!st) return;
      const patch = {}; patch[field] = el.value;
      await saveStudentBody(st, patch);
      toast("保存しました");

  bindStudentField("data-mem-kana","kana");
  bindStudentField("data-mem-label","displayLabel");
  root.querySelectorAll("[data-mem-remove]").forEach(b=>b.onclick=async ()=>{
    await dbDelete("memberships", [sel.id, b.dataset.memRemove]);
    state.memberships = state.memberships.filter(m=>!(m.groupId===sel.id && m.studentId===b.dataset.memRemove));
    toast("所属を外しました（生徒の記録自体は残ります）"); render();
  });
  root.querySelectorAll("[data-mem-page]").forEach(b=>b.onclick=()=>{ state.selectedStudentId=b.dataset.memPage; state.view="student"; render(); });
  document.getElementById("raAdd").onclick = async ()=>{
    const label = document.getElementById("raLabel").value.trim();
    const body = { displayLabel: label, memo: "" };
    if (sel.rosterMode==="full"){
      body.name = document.getElementById("raName").value.trim();
      body.kana = document.getElementById("raKana").value.trim();
      if (!body.name && !label){ toast("氏名かイニシャルを入力してください"); return; }
    } else {
      if (!label){ toast("イニシャルを入力してください"); return; }
    }
    const st = { id: uuid(), yearId: state.currentYearId };
    await putEnc("students", { id: st.id, yearId: st.yearId }, body);
    const full = Object.assign({}, st, body);
    state.students.push(full);
    const m = { groupId: sel.id, studentId: st.id, no: Number(document.getElementById("raNo").value)||null, yearId: state.currentYearId };
    await dbPut("memberships", m);
    state.memberships.push(m);
    toast("生徒を追加しました"); render();
  };
  const addEx = document.getElementById("raAddExisting");

    const sid = document.getElementById("raExisting").value;
    if (!sid) return;
    const nos = groupMembers(sel.id).map(x=>Number(x.membership.no)||0);
    const m = { groupId: sel.id, studentId: sid, no: (nos.length?Math.max(...nos):0)+1, yearId: state.currentYearId };

      sel.rosterMode = "full"; await dbPut("groups", sel);
      toast("氏名モードに切り替えました"); render(); return;
    }
    // full -> initials：確認シートつき
    openSheet(`
      <h3 class="sect" style="margin-top:0">イニシャル運用へ切り替えますか</h3>
      <div class="warnbox"><strong>氏名・ふりがなが消える操作です。</strong><br>
      このグループをイニシャル運用に切り替えると、このグループだけに所属する生徒（他の氏名グループに所属していない生徒）の<strong>氏名・ふりがなを消去</strong>します。元に戻せません。<br>
      他に氏名モードのグループへ所属している生徒の氏名は消えません。</div>
      <div class="rowflex"><button class="btn danger" id="modeConfirm">氏名を消去して切り替える</button>
      <button class="btn ghost" id="modeCancel">やめる</button></div>`);

    document.getElementById("modeConfirm").onclick = async ()=>{
      sel.rosterMode = "initials"; await dbPut("groups", sel);
      const memberIds = [...new Set(state.memberships.filter(m=>m.groupId===sel.id).map(m=>m.studentId))];
      for (const sid of memberIds){
        const myGroups = state.memberships.filter(m=>m.studentId===sid).map(m=>m.groupId);
        const allInitials = myGroups.every(gid=>{
          const g = state.groups.find(x=>x.id===gid);
          return g && g.rosterMode==="initials";
        });
        if (allInitials){
          const st = studentById(sid);
          if (st && (st.name || st.kana)){
            await putEnc("students", { id: st.id, yearId: st.yearId }, { displayLabel: st.displayLabel||"", memo: st.memo||"" });
            delete st.name; delete st.kana;
          }
        }
      }
      closeSheet(); toast("イニシャル運用に切り替えました"); render();
    };
  };
}

// ===== 座席表（seats）=====
async function loadSeatPlans(groupId, kind){
  const raw = await getSeatPlansByGroup(groupId);
  const out = [];
  for (const r of raw) if (r.kind===kind) out.push(await decryptMerge(r));
  return out.sort((a,b)=> a.effectiveFrom<b.effectiveFrom?1:-1);
}
async function renderSeats(root){
  const groups = state.groups;
  if (!state.selectedGroupId && groups.length) state.selectedGroupId = groups[0].id;
  const group = groups.find(g=>g.id===state.selectedGroupId) || null;
  let plans = [], plan = null;
  if (group){
    plans = await loadSeatPlans(group.id, state.seatKind);
    plan = plans.find(p=>p.id===state.seatPlanId) || activeSeatPlan(plans, todayString()) || plans[0] || null;
    if (plan) state.seatPlanId = plan.id;
  }
  const flip = !!settings().seatFlip;
  let h = `<div class="rowflex">${backHomeBtn("seHome")}<button class="btn small ghost" id="seRoster">👥 名簿へ</button></div>
  <h2 class="viewtitle">座席表</h2>
  <div class="card"><label class="f">グループ</label>
  <select class="t" id="seGroup">${groupOptions(state.selectedGroupId)}</select>
  <label class="f">種別</label>
  <div class="statusseg" id="seKind">
    <button data-kind="normal" class="${state.seatKind==="normal"?"on":""}">通常</button>
    <button data-kind="exam" class="${state.seatKind==="exam"?"on":""}">考査</button>
  </div>`;
  if (group){
    h += `<label class="f">配置（履歴）</label>
    <select class="t" id="sePlan"><option value="">（配置を選ぶ）</option>
      ${plans.map(p=>`<option value="${p.id}" ${plan&&p.id===plan.id?"selected":""}>${esc(p.name||"配置")}（${esc(p.effectiveFrom)}〜）</option>`).join("")}</select>
    <div class="rowflex" style="margin-top:10px">
      <button class="btn small ${state.seatEditMode?"gold":"ghost"}" id="seModeToggle">${state.seatEditMode?"編集中（タップで割当）":"閲覧モード（タップでクイックパネル）"}</button>
      <button class="btn small ${state.seatSwapMode?"gold":"ghost"}" id="seSwapToggle">入れ替えモード ${state.seatSwapMode?"ON":"OFF"}</button>
      <label style="font-size:15px"><input type="checkbox" id="seFlip" ${flip?"checked":""} style="width:22px;height:22px;vertical-align:middle"> 前後反転（教卓側を下に）</label>
    </div>
    <h3 class="sect">新しい配置を作る</h3>
    <div class="rowflex">
      <span>行 <input class="t smallnum" type="number" id="spRows" value="6"></span>
      <span>列 <input class="t smallnum" type="number" id="spCols" value="6"></span>
      <span style="flex:1;min-width:160px">名前 <input class="t" id="spName" placeholder="例：5月・通常配置"></span>
      <span>有効開始日 <input class="t" type="date" id="spFrom" value="${todayString()}" style="max-width:180px"></span>
      <button class="btn small gold" id="spCreate">配置を作成</button>
    </div></div>`;
  } else {
    h += `<p class="muted">グループがありません。名簿でグループを作成してください。</p></div>`;
  }
  if (group && plan){
    const seats = plan.seats || {}, nonSeats = plan.nonSeats || [];
    const rowIdx = [];
    for (let r=0;r<plan.rows;r++) rowIdx.push(r);
    const dispRows = flip ? rowIdx.slice().reverse() : rowIdx;
    h += `<div class="card"><h3 class="sect" style="margin-top:0">${esc(plan.name||"配置")}（${plan.kind==="exam"?"考査":"通常"}・${esc(plan.effectiveFrom)}〜）</h3>
    <p class="muted">${flip?"教卓は下側です":"教卓は上側です"}${state.seatSwapMode?" ／ 入れ替えモード：2つのセルを順にタップしてください":""}</p>
    <div class="seatgrid" style="grid-template-columns:repeat(${plan.cols},1fr)">`;
    for (const r of dispRows){
      for (let c=0;c<plan.cols;c++){
        const key = seatKey(r,c);
        const isNon = nonSeats.includes(key);
        const sid = seats[key];
        const st = sid ? studentById(sid) : null;
        const label = isNon ? "（座席なし）" : (st ? esc(displayNameOf(st, group.id)) : "空席");
        const cls = isNon ? "nonseat" : (st ? "" : "empty");
        const swapCls = state.seatSwapFirst===key ? " swap1" : "";
        h += `<div class="seatcell ${cls}${swapCls}" data-seat="${key}">${label}<br><span class="muted" style="font-size:11px">${key}</span></div>`;
      }
    }
    h += `</div></div>`;
  } else if (group){
    h += `<div class="card">この種別の配置はまだありません。「新しい配置を作る」から作成してください。</div>`;
  }
  root.innerHTML = h;
  bindHome("seHome");
  document.getElementById("seRoster").onclick = ()=>{ state.view="roster"; render(); };
  document.getElementById("seGroup").onchange = (e)=>{ state.selectedGroupId=e.target.value||null; state.seatPlanId=null; render(); };
  root.querySelectorAll("#seKind button").forEach(b=>b.onclick=()=>{ state.seatKind=b.dataset.kind; state.seatPlanId=null; render(); });
  if (!group) return;
  const planSel = document.getElementById("sePlan");
  if (planSel) planSel.onchange = (e)=>{ state.seatPlanId=e.target.value||null; render(); };
  document.getElementById("seModeToggle").onclick = ()=>{ state.seatEditMode=!state.seatEditMode; render(); };
  document.getElementById("seSwapToggle").onclick = ()=>{ state.seatSwapMode=!state.seatSwapMode; state.seatSwapFirst=null; render(); };
  document.getElementById("seFlip").onchange = (e)=>{ saveSettings({ seatFlip: e.target.checked }); render(); };
  document.getElementById("spCreate").onclick = async ()=>{
    const rows = Math.max(1, Number(document.getElementById("spRows").value)||1);
    const cols = Math.max(1, Number(document.getElementById("spCols").value)||1);
    const rec = { id: uuid(), groupId: group.id, yearId: state.currentYearId, kind: state.seatKind,
      name: document.getElementById("spName").value.trim() || "配置",
      effectiveFrom: document.getElementById("spFrom").value || todayString(), rows, cols };
    await putEnc("seatPlans", rec, { seats: {}, nonSeats: [] });
    state.seatPlanId = rec.id;
    toast("配置を作成しました"); render();
  };
  if (!plan) return;
  const savePlan = async (seats, nonSeats)=>{
    await putEnc("seatPlans",
      { id: plan.id, groupId: plan.groupId, yearId: plan.yearId, kind: plan.kind, name: plan.name, effectiveFrom: plan.effectiveFrom, rows: plan.rows, cols: plan.cols },
      { seats, nonSeats });
  };
  root.querySelectorAll("[data-seat]").forEach(cell=>cell.addEventListener("click", async ()=>{
    const key = cell.dataset.seat;
    const seats = Object.assign({}, plan.seats||{});
    const nonSeats = (plan.nonSeats||[]).slice();
    if (state.seatSwapMode){
      if (!state.seatSwapFirst){ state.seatSwapFirst = key; render(); return; }
      const first = state.seatSwapFirst;
      const a = seats[first], b = seats[key];
      if (b) seats[first]=b; else delete seats[first];
      if (a) seats[key]=a; else delete seats[key];
      state.seatSwapFirst = null;
      await savePlan(seats, nonSeats);
      toast("座席を入れ替えました"); render(); return;
    }
    if (state.seatEditMode){
      const members = groupMembers(group.id);
      openSheet(`
        <h3 class="sect" style="margin-top:0">座席 ${esc(key)} の割当</h3>
        ${nonSeats.includes(key)?`<p class="muted">このセルは現在「座席でないセル」です。</p>`:""}
        <div style="display:grid;gap:8px">
        ${members.map(({student:st})=>`<button class="btn ghost" data-asn="${st.id}">${esc(displayNameOf(st, group.id))}</button>`).join("")}
        <button class="btn" id="asnEmpty">空席にする</button>
        ${nonSeats.includes(key)?`<button class="btn" id="asnSeat">座席に戻す</button>`:`<button class="btn" id="asnNon">座席でないセルにする</button>`}
        <button class="btn small ghost" id="asnCancel">キャンセル</button></div>`);
      document.getElementById("asnCancel").onclick = ()=>closeSheet();
      root.ownerDocument.querySelectorAll("[data-asn]").forEach(b=>b.onclick=async ()=>{
        seats[key] = b.dataset.asn;
        await savePlan(seats, nonSeats.filter(k=>k!==key));
        closeSheet(); toast("割り当てました"); render();
      });
      document.getElementById("asnEmpty").onclick = async ()=>{ delete seats[key]; await savePlan(seats, nonSeats); closeSheet(); render(); };
      const asnNon = document.getElementById("asnNon");
      if (asnNon) asnNon.onclick = async ()=>{ delete seats[key]; await savePlan(seats, [...new Set(nonSeats.concat([key]))]); closeSheet(); render(); };
      const asnSeat = document.getElementById("asnSeat");
      if (asnSeat) asnSeat.onclick = async ()=>{ await savePlan(seats, nonSeats.filter(k=>k!==key)); closeSheet(); render(); };
      return;
    }
    // 閲覧モード：クイックパネル
    const sid = seats[key];
    if (!sid || nonSeats.includes(key)){ toast("空席です（編集は「編集中」に切り替えてください）"); return; }
    openSeatQuickPanel(group, sid);
  }));
}
async function openSeatQuickPanel(group, studentId){
  const st = studentById(studentId);
  if (!st) return;
  const today = todayString();
  const cells = await buildDayCells(today);
  const groupCourses = state.courses.filter(c=>c.groupId===group.id || group.courseId===c.id);
  const myCells = cells.filter(c=>c.courseId && groupCourses.some(x=>x.id===c.courseId));
  let attHtml = "";
  for (const c of myCells){
    const lessonId = lessonKey(today, c.period);
    const rec = await getEnc("attendance", lessonId);
    const cur = rec && rec.marks && rec.marks[studentId] ? rec.marks[studentId].status : null;
    attHtml += `<div class="listitem" style="cursor:default"><span class="t">${esc(periodLabel(c.period))} ${esc(cellTitle(c))}</span>
      現在：${cur?esc(attendanceStatusLabel(cur)):"出席"}
      <div class="statusseg" style="margin-top:6px">
        <button data-qp-clear="${lessonId}">出席に戻す</button>
        ${ATTENDANCE_STATUSES.map(x=>`<button data-qp-lid="${lessonId}" data-qp-status="${x.id}" class="${cur===x.id?"on":""}">${x.label}</button>`).join("")}
      </div></div>`;
  }
  openSheet(`
    <h3 class="sect" style="margin-top:0">${esc(displayNameOf(st, group.id))} ― クイックパネル</h3>
    <p class="muted">${esc(group.name)} ／ ${today} の出欠</p>
    ${attHtml || `<p class="muted">今日このグループの講座のコマはありません。</p>`}
    <h3 class="sect">所見メモを追加</h3>
    <textarea class="t" id="qpObsText" placeholder="授業中の気づき・活躍など"></textarea>
    <label class="f">観点タグ</label><select class="t" id="qpObsView">${viewpointOptions("none")}</select>
    <div class="rowflex" style="margin-top:12px">
      <button class="btn gold" id="qpObsAdd">所見メモを保存</button>
      <button class="btn" id="qpGoStudent">カルテ（生徒ページ）へ</button>
      <button class="btn ghost" id="qpClose">閉じる</button></div>`);
  document.getElementById("qpClose").onclick = ()=>closeSheet();
  document.getElementById("qpGoStudent").onclick = ()=>{ closeSheet(); state.selectedStudentId=studentId; state.view="student"; render(); };
  document.getElementById("qpObsAdd").onclick = async ()=>{
    const ok = await addObservation(studentId, group.courseId||null, null,
      document.getElementById("qpObsText").value, document.getElementById("qpObsView").value);
    if (ok){ toast("所見メモを保存しました"); closeSheet(); }
  };
  const setAtt = async (lessonId, status)=>{
    const lesson = await getOrDraftLesson(today, Number(lessonId.split("#")[1]));
    const course = state.courses.find(c=>c.id===lesson.courseId);
    const grp = course ? courseGroup(course) : group;
    const rec = await getEnc("attendance", lessonId);
    const marks = Object.assign({}, rec && rec.marks ? rec.marks : {});
    if (status) marks[studentId] = { status, memo: (marks[studentId]&&marks[studentId].memo)||"" };
    else delete marks[studentId];
    await putEnc("attendance",
      { id: lessonId, date: today, yearId: state.currentYearId, courseId: lesson.courseId||null, groupId: grp?grp.id:group.id },
      { marks, note: (rec && rec.note) || "" });
    toast("出欠を保存しました");
    openSeatQuickPanel(group, studentId);
  };
  document.querySelectorAll("[data-qp-status]").forEach(b=>b.onclick=()=>setAtt(b.dataset.qpLid, b.dataset.qpStatus));
  document.querySelectorAll("[data-qp-clear]").forEach(b=>b.onclick=()=>setAtt(b.dataset.qpClear, null));
}

// ===== 時限チェック（check）=====
async function renderCheck(root){
  const date = state.selectedDate || todayString();
  const period = state.selectedPeriod == null ? currentPeriodCode() : state.selectedPeriod;
  const lesson = await getOrDraftLesson(date, period);
  const course = state.courses.find(c=>c.id===lesson.courseId) || null;
  const group = course ? courseGroup(course) : null;
  let h = `<div class="rowflex">${backHomeBtn("ckHome")}
    <button class="btn small ghost" id="ckDay">📝 日エリア</button>
    <button class="btn small ghost" id="ckSeats">💺 座席表</button></div>
  <h2 class="viewtitle">時限チェック ― ${esc(date)}（${WEEKDAY_LABELS[dayOfWeek(date)]}） ${esc(periodLabel(period))}</h2>`;
  if (!course){
    h += `<div class="card">このコマには講座が設定されていません。週案や授業記録で講座を選んでください。
    <div style="margin-top:10px"><button class="btn gold" id="ckGoLesson">授業記録を開く</button></div></div>`;
    root.innerHTML = h; bindHome("ckHome");
    document.getElementById("ckGoLesson").onclick = ()=>{ state.view="lesson"; render(); };
    document.getElementById("ckDay").onclick = ()=>{ state.view="day"; render(); };
    document.getElementById("ckSeats").onclick = ()=>{ state.view="seats"; render(); };
    return;
  }
  if (!group){
    h += `<div class="card"><strong>${esc(courseName(course.id))}</strong> には名簿グループが設定されていません。出欠を取るには、名簿でグループを作り、設定画面の講座一覧でこの講座にグループを選んでください。
    <div class="rowflex" style="margin-top:10px"><button class="btn gold" id="ckGoRoster">👥 名簿へ</button>
    <button class="btn" id="ckGoSettings">⚙ 設定へ</button></div></div>`;
    root.innerHTML = h; bindHome("ckHome");
    document.getElementById("ckGoRoster").onclick = ()=>{ state.view="roster"; render(); };
    document.getElementById("ckGoSettings").onclick = ()=>{ state.view="settings"; render(); };
    document.getElementById("ckDay").onclick = ()=>{ state.view="day"; render(); };
    document.getElementById("ckSeats").onclick = ()=>{ state.view="seats"; render(); };
    return;
  }
  const rec = await getEnc("attendance", lesson.id);
  const marks = Object.assign({}, rec && rec.marks ? rec.marks : {});
  const note = (rec && rec.note) || "";
  const members = groupMembers(group.id);
  if (!state.checkStudentId || !members.some(x=>x.student.id===state.checkStudentId)){
    state.checkStudentId = members.length ? members[0].student.id : null;
  }
  const selId = state.checkStudentId;
  const selMark = selId ? marks[selId] : null;
  h += `<p class="muted">講座：<strong>${esc(courseName(course.id))}</strong> ／ 名簿：${esc(group.name)}（${members.length}名）。出席は既定です。異常のある生徒だけをタップで記録します。</p>`;
  if (rec && rec.decryptError) h += `<div class="warnbox"><strong>警告：</strong>このコマの出欠レコードを復号できませんでした。表示は空になっています。保存すると上書きされるため、ご注意ください。</div>`;
  h += `<div class="card"><h3 class="sect" style="margin-top:0">名簿（タップで選択）</h3>`;
  h += members.map(({membership:m, student:st})=>{
    const mk = marks[st.id];
    return `<div class="listitem" data-ck-row="${st.id}" style="${st.id===selId?"outline:3px solid var(--gold);background:#fdf6dd":""}">
      <span class="t">${esc(displayNameOf(st, group.id))}</span>
      ${mk?`<span class="chip">${esc(attendanceStatusLabel(mk.status))}</span>${mk.memo?` <span class="muted">✎メモあり</span>`:""}`:`<span class="muted">出席</span>`}
    </div>`;
  }).join("") || `<p class="muted">このグループに生徒がいません。名簿で追加してください。</p>`;
  h += `</div>`;
  if (selId){
    const st = studentById(selId);
    h += `<div class="card" style="position:sticky;bottom:0"><h3 class="sect" style="margin-top:0">操作パネル ― ${esc(displayNameOf(st, group.id))}</h3>
    <div class="statusseg" id="ckStatus">
      <button data-ck-clear="1" class="${!selMark?"on":""}">出席に戻す</button>
      ${ATTENDANCE_STATUSES.map(x=>`<button data-ck-st="${x.id}" class="${selMark&&selMark.status===x.id?"on":""}">${x.label}</button>`).join("")}
    </div>
    <label class="f">その他（自由記述）メモ ― どの状態にも併記できます</label>
    <textarea class="t" id="ckMemo" placeholder="例：保護者から連絡あり、病院受診のため">${esc(state.privacyOn?mask2(selMark?selMark.memo:""):(selMark?selMark.memo||"":""))}</textarea>
    <div class="savednote" id="ckSaved">状態ボタンやメモの変更は、そのたびに暗号化して自動保存します。</div>
    <h3 class="sect">クイック記録（所見メモ）</h3>
    <textarea class="t" id="ckObsText" placeholder="この生徒の活躍・配慮事項など"></textarea>
    <label class="f">観点タグ</label><select class="t" id="ckObsView">${viewpointOptions("none")}</select>
    <div style="margin-top:8px"><button class="btn small gold" id="ckObsAdd">所見メモを追加</button>
    <button class="btn small ghost" id="ckGoStudent">生徒ページへ</button></div>
    </div>`;
  }
  h += `<div class="card"><label class="f">このコマの出欠メモ（全体）</label>
  <textarea class="t" id="ckNote">${esc(state.privacyOn?mask2(note):note)}</textarea>
  <div class="savednote" id="ckNoteSaved"></div>
  <div class="rowflex" style="margin-top:10px">
    <button class="btn gold" id="ckGoLesson">📖 授業記録を開く</button>
  </div></div>`;
  root.innerHTML = h;
  bindHome("ckHome");
  document.getElementById("ckDay").onclick = ()=>{ state.view="day"; render(); };
  document.getElementById("ckSeats").onclick = ()=>{ state.selectedGroupId=group.id; state.view="seats"; render(); };
  document.getElementById("ckGoLesson").onclick = ()=>{ state.view="lesson"; render(); };
  const plain = { id: lesson.id, date, yearId: state.currentYearId, courseId: course.id, groupId: group.id };
  const saveAtt = async (newMarks, newNote)=>{
    await putEnc("attendance", plain, { marks: newMarks, note: newNote });
    const el = document.getElementById("ckSaved");
    if (el) el.textContent = "保存済み " + new Date().toLocaleTimeString("ja-JP");
  };
  root.querySelectorAll("[data-ck-row]").forEach(el=>el.onclick=()=>{ state.checkStudentId=el.dataset.ckRow; render(); });
  root.querySelectorAll("[data-ck-st]").forEach(b=>b.onclick=async ()=>{
    if (!selId) return;
    const cur = marks[selId] || { status: b.dataset.ckSt, memo: "" };
    cur.status = b.dataset.ckSt;
    marks[selId] = cur;
    await saveAtt(marks, document.getElementById("ckNote") ? (state.privacyOn?note:document.getElementById("ckNote").value) : note);
    render();
  });
  root.querySelectorAll("[data-ck-clear]").forEach(b=>b.onclick=async ()=>{
    if (!selId) return;
    delete marks[selId];
    await saveAtt(marks, note);
    render();
  });
  const memoEl = document.getElementById("ckMemo");
  if (memoEl){
    if (state.privacyOn) memoEl.disabled = true;
    memoEl.addEventListener("input", async ()=>{
      if (!selId) return;
      const cur = marks[selId] || { status: "other", memo: "" };
      cur.memo = memoEl.value;
      if (cur.memo || cur.status) marks[selId] = cur;
      await saveAtt(marks, note);
    });
  }
  const noteEl = document.getElementById("ckNote");
  if (noteEl){
    if (state.privacyOn) noteEl.disabled = true;
    noteEl.addEventListener("input", async ()=>{
      await putEnc("attendance", plain, { marks, note: noteEl.value });
      const el = document.getElementById("ckNoteSaved");
      if (el) el.textContent = "保存済み " + new Date().toLocaleTimeString("ja-JP");
    });
  }
  const obsAdd = document.getElementById("ckObsAdd");
  if (obsAdd) obsAdd.onclick = async ()=>{
    const ok = await addObservation(selId, course.id, lesson.id,
      document.getElementById("ckObsText").value, document.getElementById("ckObsView").value);
    if (ok){ toast("所見メモを保存しました"); document.getElementById("ckObsText").value=""; }
  };
  const gs = document.getElementById("ckGoStudent");
  if (gs) gs.onclick = ()=>{ state.selectedStudentId=selId; state.view="student"; render(); };
}

// ===== 提出物（submissions）=====
async function renderSubmissions(root){
  if (!state.selectedCourseId && state.courses.length) state.selectedCourseId = state.courses[0].id;
  const course = state.courses.find(c=>c.id===state.selectedCourseId) || null;
  const group = course ? courseGroup(course) : null;
  let h = `<div class="rowflex">${backHomeBtn("sbHome")}<button class="btn small ghost" id="sbCourse">📚 講座ビューへ</button></div>
  <h2 class="viewtitle">提出物</h2>
  <div class="card"><label class="f">講座</label><select class="t" id="sbCourseSel">${courseOptions(state.selectedCourseId)}</select></div>`;
  let assignments = [], statesById = {};
  if (course){
    assignments = (await getAssignmentsByCourse(course.id)).slice().sort((a,b)=> (a.dueDate||"")<(b.dueDate||"")?-1:1);
    for (const a of assignments){
      const rec = await getEnc("submissionRecords", a.id);
      statesById[a.id] = rec && rec.states ? rec.states : {};
    }
    const memberIds = group ? groupMembers(group.id).map(x=>x.student.id) : [];
    h += `<h3 class="sect">課題一覧</h3>`;
    h += assignments.map(a=>{
      const un = computeUnsubmitted(memberIds, statesById[a.id]).length;
      return `<div class="listitem" data-sb-open="${a.id}"><span class="t">${esc(a.title)}</span>
        <span class="muted">期限：${esc(a.dueDate||"―")} ／ 評価：${esc(evalKindLabel(a.evalKind))}</span>
        ${group?`<span class="badge" style="background:${un?"var(--danger)":"var(--ok)"}">未提出 ${un} 名</span>`:""}
      </div>`;
    }).join("") || `<div class="card">課題はまだありません。</div>`;
    const courseLessons = (await dbGetByIndex("lessons","byCourse",course.id)).slice().sort((a,b)=>a.date<b.date?-1:1);
    h += `<div class="card"><h3 class="sect" style="margin-top:0">新しい課題</h3>
      <label class="f">課題名</label><input class="t" id="saTitle" placeholder="例：ワークシート第3章">
      <label class="f">提出期限</label><input class="t" type="date" id="saDue" value="${todayString()}">
      <label class="f">評価方法</label><select class="t" id="saKind">${EVAL_KINDS.map(k=>`<option value="${k.id}">${k.label}</option>`).join("")}</select>
      <label class="f">出したコマ（任意）</label><select class="t" id="saLesson"><option value="">（指定なし）</option>
        ${courseLessons.map(l=>`<option value="${l.id}">${esc(l.date)} ${esc(periodLabel(l.period))}</option>`).join("")}</select>
      <label class="f">観点配分（知識・技能／思考・判断・表現／態度）</label>
      <div class="rowflex">
        <input class="t smallnum" type="number" step="0.1" min="0" max="1" id="saWk" value="0">
        <input class="t smallnum" type="number" step="0.1" min="0" max="1" id="saWt" value="0">
        <input class="t smallnum" type="number" step="0.1" min="0" max="1" id="saWa" value="1">
      </div>
      <button class="btn gold" id="saCreate" style="margin-top:10px">課題を追加</button></div>`;
  }
  const selA = assignments.find(a=>a.id===state.selectedAssignmentId) || null;
  if (course && selA){
    const states = Object.assign({}, statesById[selA.id]||{});
    const members = group ? groupMembers(group.id) : [];
    const unIds = computeUnsubmitted(members.map(x=>x.student.id), states);
    h += `<div class="card"><h3 class="sect" style="margin-top:0">提出チェック ― ${esc(selA.title)}</h3>
    <p class="muted">評価方法：${esc(evalKindLabel(selA.evalKind))} ／ 期限：${esc(selA.dueDate||"―")}。変更のたびに暗号化して自動保存します。</p>
    <h3 class="sect">未提出者リスト（${unIds.length}名）</h3>
    ${unIds.length?`<p>${unIds.map(id=>{ const st=studentById(id); return esc(st?displayNameOf(st, group.id):"（不明）"); }).join("、")}</p>`:`<p class="muted">全員提出済み（または免除）です。</p>`}
    ${members.map(({student:st})=>{
      const cur = states[st.id];
      let valueHtml = "";
      if (selA.evalKind==="check"){
        valueHtml = `<div class="statusseg" style="margin-top:6px">${["○","△","×"].map(v=>`<button data-sb-val="${st.id}:${v}" class="${cur&&cur.value===v?"on":""}">${v}</button>`).join("")}</div>`;
      } else if (selA.evalKind==="grade"){
        valueHtml = `<div class="statusseg" style="margin-top:6px">${["A","B","C"].map(v=>`<button data-sb-val="${st.id}:${v}" class="${cur&&cur.value===v?"on":""}">${v}</button>`).join("")}</div>`;
      } else if (selA.evalKind==="score"){
        valueHtml = `<div style="margin-top:6px">評価（100点換算） <input class="t smallnum" type="number" data-sb-score="${st.id}" value="${cur&&cur.value!=null?esc(cur.value):""}"></div>`;
      }
      return `<div class="listitem" style="cursor:default"><span class="t">${esc(displayNameOf(st, group.id))}</span>
        <span class="muted">${cur?esc(submissionStatusLabel(cur.status)):"未提出"}</span>
        <div class="statusseg" style="margin-top:6px">
          <button data-sb-clear="${st.id}" class="${!cur?"on":""}">未提出に戻す</button>
          ${SUBMISSION_STATUSES.map(x=>`<button data-sb-st="${st.id}:${x.id}" class="${cur&&cur.status===x.id?"on":""}">${x.label}</button>`).join("")}
        </div>
        ${valueHtml}
        <div style="margin-top:6px">メモ <input class="t" data-sb-memo="${st.id}" value="${esc(state.privacyOn?mask2(cur?cur.memo:""):(cur?cur.memo||"":""))}" ${state.privacyOn?"disabled":""}></div>
      </div>`;
    }).join("") || `<p class="muted">対象名簿がありません。講座に名簿グループを設定してください。</p>`}
    <div class="savednote" id="sbSaved"></div></div>`;
  }
  root.innerHTML = h;
  bindHome("sbHome");
  document.getElementById("sbCourse").onclick = ()=>{ state.view = course ? "course" : "courses"; render(); };
  document.getElementById("sbCourseSel").onchange = (e)=>{ state.selectedCourseId=e.target.value||null; state.selectedAssignmentId=null; render(); };
  root.querySelectorAll("[data-sb-open]").forEach(el=>el.onclick=()=>{ state.selectedAssignmentId=el.dataset.sbOpen; render(); });
  if (course){
    document.getElementById("saCreate").onclick = async ()=>{
      const title = document.getElementById("saTitle").value.trim();
      if (!title){ toast("課題名を入力してください"); return; }
      const a = { id: uuid(), courseId: course.id, groupId: group?group.id:null, yearId: state.currentYearId,
        termId: termIdForDate(state.terms, document.getElementById("saDue").value || todayString()),
        title, dueDate: document.getElementById("saDue").value || "",
        lessonId: document.getElementById("saLesson").value || null,
        evalKind: document.getElementById("saKind").value,
        viewWeights: normalizeViewWeights({ knowledge: Number(document.getElementById("saWk").value)||0, thinking: Number(document.getElementById("saWt").value)||0, attitude: Number(document.getElementById("saWa").value)||0 }),
        memo: "", level: 1 };
      await dbPut("assignments", a);
      state.selectedAssignmentId = a.id;
      toast("課題を追加しました"); render();
    };
  }
  if (course && selA && group){
    const states = Object.assign({}, statesById[selA.id]||{});
    const plain = { id: selA.id, courseId: course.id, yearId: state.currentYearId };
    const save = async ()=>{
      await putEnc("submissionRecords", plain, { states });
      const el = document.getElementById("sbSaved");
      if (el) el.textContent = "保存済み " + new Date().toLocaleTimeString("ja-JP");
    };
    root.querySelectorAll("[data-sb-st]").forEach(b=>b.onclick=async ()=>{
      const i = b.dataset.sbSt.lastIndexOf(":");
      const sid = b.dataset.sbSt.slice(0,i), status = b.dataset.sbSt.slice(i+1);
      const cur = states[sid] || { status, value: null, memo: "", submittedDate: "" };
      cur.status = status;
      if (!cur.submittedDate) cur.submittedDate = todayString();
      states[sid] = cur;
      await save(); render();
    });
    root.querySelectorAll("[data-sb-clear]").forEach(b=>b.onclick=async ()=>{
      delete states[b.dataset.sbClear];
      await save(); render();
    });
    root.querySelectorAll("[data-sb-val]").forEach(b=>b.onclick=async ()=>{
      const i = b.dataset.sbVal.lastIndexOf(":");
      const sid = b.dataset.sbVal.slice(0,i), v = b.dataset.sbVal.slice(i+1);
      const cur = states[sid] || { status: "submitted", value: null, memo: "", submittedDate: todayString() };
      cur.value = v; states[sid] = cur;
      await save(); render();
    });
    root.querySelectorAll("[data-sb-score]").forEach(el=>el.addEventListener("change", async ()=>{
      const sid = el.dataset.sbScore;
      const cur = states[sid] || { status: "submitted", value: null, memo: "", submittedDate: todayString() };
      cur.value = el.value==="" ? null : Number(el.value);
      states[sid] = cur;
      await save();
    }));
    root.querySelectorAll("[data-sb-memo]").forEach(el=>el.addEventListener("input", async ()=>{
      const sid = el.dataset.sbMemo;
      const cur = states[sid] || { status: "submitted", value: null, memo: "", submittedDate: todayString() };
      cur.memo = el.value; states[sid] = cur;
      await save();
    }));
  }
}

// ===== 第3期：カルテ記録の入力シート群 =====
function handoffBadge(rec){ return rec && rec.handoff ? ` <span class="chip">申し送り</span>` : ""; }
async function loadStudentRecords(store, studentId){
  const raw = await dbGetByIndex(store, "byStudent", studentId);
  const out = [];
  for (const r of raw) out.push(await decryptMerge(r));
  return out.filter(x=>!x.decryptError);
}

    ${delId?`<button class="btn danger" id="${delId}">削除</button>`:""}
    <button class="btn ghost" id="ctCancel">${cancelLabel||"キャンセル"}</button></div>`;
}

function openInterviewSheet(studentId, rec){

    kind: "two", participants: "", place: "", summary: "", agreements: "", nextSteps: "", handoff: false };
  openSheet(`
    <h3 class="sect" style="margin-top:0">${isNew?"面談記録を追加":"面談記録を編集"}（Level 3）</h3>

// ===== 生徒ページ（student）=====
async function renderStudent(root){
  let st = state.selectedStudentId ? studentById(state.selectedStudentId) : null;
  let h = `<div class="rowflex">${backHomeBtn("stHome")}<button class="btn small ghost" id="stRoster">👥 名簿へ</button></div>
  <h2 class="viewtitle">生徒ページ</h2>
  <div class="card"><label class="f">生徒を選ぶ</label>
  <select class="t" id="stSel"><option value="">（生徒を選ぶ）</option>
  ${state.students.map(x=>{
    const m0 = state.memberships.find(m=>m.studentId===x.id);
    return `<option value="${x.id}" ${st&&x.id===st.id?"selected":""}>${esc(displayNameOf(x, m0?m0.groupId:null))}</option>`;
  }).join("")}</select></div>`;
  if (st){
    const myMemberships = state.memberships.filter(m=>m.studentId===st.id);
    const myGroups = myMemberships.map(m=>state.groups.find(g=>g.id===m.groupId)).filter(Boolean);
    h += `<div class="card"><h3 class="sect" style="margin-top:0">${esc(displayNameOf(st, myMemberships[0]?myMemberships[0].groupId:null))}</h3>
    <p>所属：${myMemberships.map(m=>{ const g=state.groups.find(x=>x.id===m.groupId); return `${esc(g?g.name:"（不明）")} #${m.no==null?"―":m.no}`; }).join(" ／ ") || "なし"}</p></div>`;

    // 出欠推移
    const yr = yearRange(state.currentYearId);
    const attRaw = await dbGetRange("attendance", "byDate", yr.startDate, yr.endDate);
    const marksList = [], recent = [];
    for (const r of attRaw){
      const dec = await decryptMerge(r);
      if (dec.decryptError || !dec.marks) continue;
      if (dec.marks[st.id]){ marksList.push({ [st.id]: dec.marks[st.id] }); recent.push({ date: dec.date, id: dec.id, courseId: dec.courseId, mark: dec.marks[st.id] }); }
    }
    const summary = summarizeAttendance(marksList)[st.id] || { total: 0, byStatus: {} };
    recent.sort((a,b)=> a.date<b.date?1:-1);
    h += `<div class="card"><h3 class="sect" style="margin-top:0">出欠推移（${state.currentYearId}年度）</h3>
    <p>異常の記録：合計 ${summary.total} 件 ${ATTENDANCE_STATUSES.map(x=>`${x.label} ${summary.byStatus[x.id]||0}`).join(" ／ ")}</p>
    ${recent.slice(0,20).map(r=>`<div class="listitem" style="cursor:default"><span class="t">${esc(r.date)} ${esc(r.courseId?courseName(r.courseId):"")}</span>
      <span class="chip">${esc(attendanceStatusLabel(r.mark.status))}</span>${r.mark.memo?`<br>${esc(mask2(r.mark.memo))}`:""}</div>`).join("") || `<p class="muted">出欠の異常記録はありません。</p>`}
    </div>`;

    // 提出状況・スコア推移（所属講座）
    const myCourses = state.courses.filter(c=>c.groupId && myGroups.some(g=>g.id===c.groupId));
    let subHtml = "", scoreHtml = "";
    for (const c of myCourses){
      const assigns = await getAssignmentsByCourse(c.id);
      for (const a of assigns){
        const rec = await getEnc("submissionRecords", a.id);
        const cur = rec && rec.states ? rec.states[st.id] : null;
        subHtml += `<div class="listitem" style="cursor:default"><span class="t">${esc(a.title)}</span> <span class="muted">${esc(c.name)} ／ 期限 ${esc(a.dueDate||"―")}</span><br>${cur?`${esc(submissionStatusLabel(cur.status))}${cur.value!=null&&cur.value!==""?`（${esc(cur.value)}）`:""}`:"未提出"}</div>`;
      }
      const tests = await getTestsByCourse(c.id);
      for (const t of tests.slice().sort((a,b)=> (a.date||"")<(b.date||"")?-1:1)){
        const rec = await getEnc("scoreRecords", t.id);
        const cur = rec && rec.scores ? rec.scores[st.id] : null;
        scoreHtml += `<div class="listitem" style="cursor:default"><span class="t">${esc(t.name)}</span> <span class="muted">${esc(t.date||"―")} ／ ${esc(testKindLabel(t.kind))}</span><br>${cur?(cur.absent?"未受験（欠席）":`${esc(cur.score)} / ${esc(t.maxScore)} 点`):"未入力"}</div>`;
      }
    }
    h += `<div class="card"><h3 class="sect" style="margin-top:0">提出状況</h3>${subHtml || `<p class="muted">所属講座の課題はありません。</p>`}</div>`;
    h += `<div class="card"><h3 class="sect" style="margin-top:0">スコア推移</h3>${scoreHtml || `<p class="muted">所属講座のテストはありません。</p>`}</div>`;

    // 所見メモ（観点別）
    const obsRaw = await getObservationsByStudent(st.id);
    const obs = [];
    for (const r of obsRaw) obs.push(await decryptMerge(r));
    obs.sort((a,b)=> (a.date||"")<(b.date||"")?1:-1);
    h += `<div class="card"><h3 class="sect" style="margin-top:0">所見メモ（いいとこみつけ）</h3>`;
    for (const v of VIEWPOINTS.concat([{id:"none",label:"（観点なし）"}])){
      const list = obs.filter(o=>!o.decryptError && (o.viewpoint||"none")===v.id);
      if (!list.length) continue;
      h += `<h3 class="sect">${esc(v.label)}（${list.length}件）</h3>` + list.map(o=>`<div class="listitem" style="cursor:default"><span class="muted">${esc(o.date||"")}</span>${handoffBadge(o)}<br>${esc(mask2(o.text||""))}</div>`).join("");
    }
    if (!obs.length) h += `<p class="muted">所見メモはまだありません。</p>`;
    h += `<label class="f">所見メモを追加</label><textarea class="t" id="stObsText"></textarea>
    <div class="rowflex">${phraseBtnHtml("stObsText")}</div>
    <label class="f">観点タグ</label><select class="t" id="stObsView">${viewpointOptions("none")}</select>
    <label class="f">講座（任意）</label><select class="t" id="stObsCourse"><option value="">（なし）</option>${myCourses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
    <label class="f"><input type="checkbox" id="stObsHandoff" style="width:22px;height:22px;vertical-align:middle"> 次年度担任への申し送り対象にする</label>
    <div style="margin-top:8px"><button class="btn gold" id="stObsAdd">追加する</button></div></div>`;

    // ===== 第3期：カルテ拡張 =====
    const stMarkers = await loadMarkers();
    const stMarker = findMarker(stMarkers, st.id, "student", st.id);
    h += `<div class="rowflex" style="margin:6px 0 14px">
      <button class="btn gold" id="stGoComments">✏️ この生徒の所見を作る</button>
      <button class="btn ghost" id="stGoGuidance">🛡 生徒指導（案件）へ</button>
      <button class="btn ${stMarker?"danger":"ghost"}" id="stMarker">${stMarker?"⚑ 要確認（付いています）":"⚑ 要確認マーカー"}</button></div>
    ${stMarker && stMarker.memo?`<p class="muted">⚑ メモ：${esc(state.privacyOn?mask(stMarker.memo):stMarker.memo)}</p>`:""}`;

    // 進路の推移（Level 2）
    const careers = (await loadStudentRecords("careerRecords", st.id)).sort((a,b)=> (a.date||"")<(b.date||"")?1:-1);
    h += `<div class="card"><h3 class="sect" style="margin-top:0">進路の推移</h3>
    ${careers.map(r=>`<div class="listitem" data-career="${r.id}"><span class="muted">${esc(r.date||"")}</span> <span class="chip">${esc(careerKindLabel(r.kind))}</span>${handoffBadge(r)}
      <br><span class="t">${esc(mask2([r.schoolName, r.department].filter(Boolean).join(" ") || "（志望校未記入）"))}</span>
      ${r.note?`<br>${esc(mask2(r.note))}`:""}</div>`).join("") || `<p class="muted">進路の記録はまだありません。</p>`}
    <button class="btn small gold" id="stCareerAdd">＋ 進路の記録を追加</button></div>`;

    // Level 3 の節（面談・連絡・配慮）：プライバシーONでは見出しごと出さない
    if (!state.privacyOn){
      if (!l3IsActive()){
        h += `<div class="card"><h3 class="sect" style="margin-top:0">🔒 面談・保護者連絡・配慮事項（Level 3）</h3>
        <p class="muted">最重要区分のためロック中です。件数も表示されません。開くには PIN の再入力が必要です。</p>
        <button class="btn gold" id="stL3Unlock">🔒 Level 3 を開く（PIN再入力）</button></div>`;
      } else {
        const interviews = (await loadStudentRecords("interviews", st.id)).sort((a,b)=> (a.date||"")<(b.date||"")?1:-1);
        const contacts = (await loadStudentRecords("contacts", st.id)).sort((a,b)=> (a.date||"")<(b.date||"")?1:-1);
        const careNotes = await loadStudentRecords("careNotes", st.id);
        h += `<div class="card" style="border-color:var(--danger)"><h3 class="sect" style="margin-top:0">面談記録（Level 3・開いています）</h3>
        ${interviews.map(r=>`<div class="listitem" data-iv="${r.id}"><span class="muted">${esc(r.date||"")}</span> <span class="chip">${esc(interviewKindLabel(r.kind))}</span>${handoffBadge(r)}
          <br>${esc(r.summary||"")}${r.nextSteps?`<br><span class="muted">申し送り：${esc(r.nextSteps)}</span>`:""}</div>`).join("") || `<p class="muted">面談記録はありません。</p>`}
        <button class="btn small gold" id="stIvAdd">＋ 面談記録を追加</button></div>`;
        h += `<div class="card" style="border-color:var(--danger)"><h3 class="sect" style="margin-top:0">保護者連絡ログ（Level 3）</h3>
        ${contacts.map(r=>`<div class="listitem" data-cn="${r.id}"><span class="muted">${esc(r.date||"")}</span> <span class="chip">${esc(contactChannelLabel(r.channel))}／${esc(contactContextLabel(r.context))}</span>${handoffBadge(r)}
          <br><span class="t">${esc(r.subject||"（用件なし）")}</span>${r.content?`<br>${esc(r.content)}`:""}${r.result?`<br><span class="muted">対応結果：${esc(r.result)}</span>`:""}</div>`).join("") || `<p class="muted">連絡記録はありません。</p>`}
        <button class="btn small gold" id="stCnAdd">＋ 保護者連絡を追加</button></div>`;
        h += `<div class="card" style="border-color:var(--danger)"><h3 class="sect" style="margin-top:0">配慮事項（Level 3）</h3>
        ${careNotes.map(r=>`<div class="listitem" data-cr="${r.id}"><span class="chip">${esc(careCategoryLabel(r.category))}</span> ${r.active===false?`<span class="muted">（終了）</span>`:""}${handoffBadge(r)}
          <br>${esc(r.detail||"")}${r.handling?`<br><span class="muted">対応：${esc(r.handling)}</span>`:""}</div>`).join("") || `<p class="muted">配慮事項はありません。</p>`}
        <button class="btn small gold" id="stCrAdd">＋ 配慮事項を追加</button></div>`;
      }
    }
  }
  root.innerHTML = h;
  bindHome("stHome");
  document.getElementById("stRoster").onclick = ()=>{ state.view="roster"; render(); };
  document.getElementById("stSel").onchange = (e)=>{ state.selectedStudentId=e.target.value||null; render(); };
  if (st){
    document.getElementById("stObsAdd").onclick = async ()=>{
      const ok = await addObservation(st.id, document.getElementById("stObsCourse").value||null, null,
        document.getElementById("stObsText").value, document.getElementById("stObsView").value,
        document.getElementById("stObsHandoff").checked);
      if (ok){ toast("所見メモを保存しました"); render(); }
    };
    document.getElementById("stGoComments").onclick = ()=>{
      state.commentsStudentId = st.id; state.commentsDocKind = "report"; state.commentsIncludeL3 = false;
      state.view = "comments"; render();
    };

// ===== 成績・集計（grades）=====
async function buildGradeMaterials(course, term){
  const materials = [];
  const tests = (await getTestsByCourse(course.id)).filter(t=> term ? (t.termId===term.id || (t.date>=term.startDate && t.date<=term.endDate)) : true);
  for (const t of tests){
    const rec = await getEnc("scoreRecords", t.id);
    const scores = rec && rec.scores ? rec.scores : {};
    const ach = {};
    for (const sid of Object.keys(scores)) ach[sid] = scoreAchievement(scores[sid], t.maxScore);
    // 未入力の生徒も集計対象に含めるため所属生徒は呼び出し側で補う（achievements にキーが無い生徒は材料なし扱い）
    materials.push({ kind:"test", def:t, viewWeights: t.viewWeights||{}, achievements: ach });
  }
  const assigns = (await getAssignmentsByCourse(course.id)).filter(a=> term ? (a.termId===term.id || (a.dueDate>=term.startDate && a.dueDate<=term.endDate)) : true);
  for (const a of assigns){
    const rec = await getEnc("submissionRecords", a.id);
    const states = rec && rec.states ? rec.states : {};
    materials.push({ kind:"assignment", def:a, viewWeights: a.viewWeights||{}, achievements: states, evalKind: a.evalKind });
  }
  // assignments の achievements は state オブジェクトなので達成度へ変換する
  for (const m of materials){
    if (m.kind==="assignment"){
      const ach = {};
      const group = courseGroup(course);
      const ids = group ? groupMembers(group.id).map(x=>x.student.id) : Object.keys(m.achievements);
      for (const sid of ids) ach[sid] = submissionAchievement(m.evalKind, m.achievements[sid]);
      m.achievements = ach;
    }
  }
  return { materials, tests, assigns };
}
// ===== 音声読み上げ（speechSynthesis・音声合成のみ。音声認識は使わない）=====
function speechAvailable(){ try { return typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; } catch(e){ return false; } }
function speakText(text){
  if (!text || !speechAvailable()) return false;
  try {
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "ja-JP";
    const r = Number(settings().speechRate);
    u.rate = (r && r >= 0.5 && r <= 2) ? r : 1;
    window.speechSynthesis.speak(u);
    return true;
  } catch(e){ return false; }
}
function stopSpeech(){
  try { if (speechAvailable()) window.speechSynthesis.cancel(); } catch(e){}
}
function scoreReadbackText(number, score){
  const numPart = (number != null && number !== "" && !Number.isNaN(Number(number))) ? `${number}番、` : "";
  return `${numPart}${score}点`;
}
function speakScoreConfirm(number, score){
  if (settings().scoreReadback === false) return false; // 既定はオン。明示的にオフのときだけ読まない
  if (score == null || score === "") return false;
  return speakText(scoreReadbackText(number, score));
}

      { computedAt: new Date().toISOString(), params, results, note: "" });
    toast("評定スナップショットを確定保存しました"); render();
  };
  // 転記用一覧の生成
  if (!state.privacyOn){
    const body = document.getElementById("gTransferBody");
    const tsvEl = document.getElementById("gTsv");
    let rows = [];
    if (state.gradesTab==="score"){
      const termTests = tests.filter(t=> t.termId===term.id || (t.date>=term.startDate && t.date<=term.endDate));
      const recs = {};
      for (const t of termTests) { const r = await getEnc("scoreRecords", t.id); recs[t.id] = r && r.scores ? r.scores : {}; }
      body.innerHTML = `<div style="overflow-x:auto"><table class="plain"><tr><th>生徒</th>${termTests.map(t=>`<th>${esc(t.name)}</th>`).join("")}</tr>
      ${members.map(({student:st})=>`<tr><td>${esc(displayNameOf(st, group?group.id:null))}</td>${termTests.map(t=>{ const cur=recs[t.id][st.id]; return `<td>${cur?(cur.absent?"欠":(cur.score==null?"":esc(cur.score))):""}</td>`; }).join("")}</tr>`).join("")}</table></div>`;
      rows = members.map(({student:st})=>[displayNameOf(st, group?group.id:null)].concat(termTests.map(t=>{ const cur=recs[t.id][st.id]; return cur?(cur.absent?"欠":(cur.score==null?"":String(cur.score))):""; })));
    } else if (state.gradesTab==="attendance"){
      const attRaw = await dbGetRange("attendance", "byDate", term.startDate, term.endDate);
      const marksList = [];
      for (const r of attRaw){
        if (r.courseId!==course.id) continue;
        const dec = await decryptMerge(r);
        if (!dec.decryptError && dec.marks) marksList.push(dec.marks);
      }
      const sum = summarizeAttendance(marksList);
      body.innerHTML = `<div style="overflow-x:auto"><table class="plain"><tr><th>生徒</th>${ATTENDANCE_STATUSES.map(x=>`<th>${x.label}</th>`).join("")}<th>合計</th></tr>
      ${members.map(({student:st})=>{ const s2=sum[st.id]||{total:0,byStatus:{}}; return `<tr><td>${esc(displayNameOf(st, group?group.id:null))}</td>${ATTENDANCE_STATUSES.map(x=>`<td>${s2.byStatus[x.id]||0}</td>`).join("")}<td>${s2.total}</td></tr>`; }).join("")}</table></div>`;
      rows = members.map(({student:st})=>{ const s2=sum[st.id]||{total:0,byStatus:{}}; return [displayNameOf(st, group?group.id:null)].concat(ATTENDANCE_STATUSES.map(x=>String(s2.byStatus[x.id]||0))).concat([String(s2.total)]); });
    } else if (state.gradesTab==="comments"){
      const finals = [];
      for (const {student:st} of members){
        const list = await dbGetByIndex("commentDrafts", "byStudent", st.id);
        for (const raw of list){
          if (raw.termId!==term.id) continue;
          const d = await decryptMerge(raw);
          if (!d.decryptError && d.status==="final") finals.push({ st, d });
        }
      }
      body.innerHTML = finals.length ? `<div style="overflow-x:auto"><table class="plain"><tr><th>生徒</th><th>文書種別</th><th>所見本文</th></tr>
      ${finals.map(({st, d})=>{
        const tpl2 = resolveDocTemplate(state.docTemplatesCache||[], d.docKind);
        const text = tpl2.sections.map(sec=> (d.sections && d.sections[sec.key]) || "").filter(Boolean).join(" ");
        return `<tr><td>${esc(displayNameOf(st, group?group.id:null))}</td><td>${esc(docKindLabel(d.docKind))}</td><td>${esc(text)}</td></tr>`;
      }).join("")}</table></div>`
        : `<p class="muted">この学期に確定した所見はまだありません。所見づくりの画面で下書きを「確定」すると、ここに載ります。</p>`;
      rows = finals.map(({st, d})=>{
        const tpl2 = resolveDocTemplate(state.docTemplatesCache||[], d.docKind);
        const text = tpl2.sections.map(sec=> (d.sections && d.sections[sec.key]) || "").filter(Boolean).join(" ");
        return [displayNameOf(st, group?group.id:null), docKindLabel(d.docKind), text];
      });
    } else {
      body.innerHTML = `<div style="overflow-x:auto"><table class="plain"><tr><th>生徒</th>${VIEWPOINTS.map(v=>`<th>${esc(v.label)}</th>`).join("")}<th>評定</th></tr>
      ${members.map(({student:st})=>{ const g=grades[st.id]; const cell=(vid)=>{ const pv=g&&g.perView?g.perView[vid]:null; return pv?esc(pv.rating||""):""; }; return `<tr><td>${esc(displayNameOf(st, group?group.id:null))}</td><td>${cell("knowledge")}</td><td>${cell("thinking")}</td><td>${cell("attitude")}</td><td>${g&&g.rating!=null?esc(g.rating):""}</td></tr>`; }).join("")}</table></div>`;
      rows = members.map(({student:st})=>{ const g=grades[st.id]; const cell=(vid)=>{ const pv=g&&g.perView?g.perView[vid]:null; return pv?String(pv.rating||""):""; }; return [displayNameOf(st, group?group.id:null), cell("knowledge"), cell("thinking"), cell("attitude"), g&&g.rating!=null?String(g.rating):""]; });
    }
    const tsv = rows.map(r=>r.join("\t")).join("\n");
    if (tsvEl) tsvEl.value = tsv;
    root.querySelectorAll("[data-gtab]").forEach(b=>b.onclick=()=>{ state.gradesTab=b.dataset.gtab; render(); });
    const clearClip = async ()=>{ try { await navigator.clipboard.writeText(""); } catch(e){} };
    document.getElementById("gCopy").onclick = async ()=>{
      try { await navigator.clipboard.writeText(tsv); toast("コピーしました。30秒後に消去を試みます（ページを閉じた後・OS履歴は消せません）"); }
      catch(e){ toast("コピーできませんでした。テキスト欄から手でコピーしてください"); return; }
      clearTimeout(renderGrades._clipTm);
      renderGrades._clipTm = setTimeout(clearClip, 30000);
    };
    document.getElementById("gClearClip").onclick = async ()=>{ await clearClip(); toast("クリップボードを空にしました（この端末の現在値のみ）"); };
    const csvBtn = document.getElementById("gCsv");
    if (csvBtn) csvBtn.onclick = ()=>{
      const csv = rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\n");
      const blob = new Blob(["\ufeff"+csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${course.name}_${state.gradesTab}_${todayString()}.csv`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    };
  }
}

// ===== 進度トラッカー（progress）=====
async function renderProgress(root){
  if (!state.selectedCourseId && state.courses.length) state.selectedCourseId = state.courses[0].id;
  // 教科・講座名でまとめる（同一 subject+name の講座を1グループとして並べる）
  const byKey = new Map();
  for (const c of state.courses){
    const key = `${c.subject}||${c.name}`;
    if (!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(c);
  }
  let h = `<div class="rowflex">${backHomeBtn("pHome")}</div>
  <h2 class="viewtitle">進度トラッカー</h2>`;
  for (const [key, cs] of byKey){
    h += `<h3 class="sect">${esc(cs[0].subject)} ${esc(cs[0].name)}</h3>`;
    for (const c of cs){
      const units = await getUnitsByCourse(c.id);
      const lessons = await dbGetByIndex("lessons","byCourse",c.id);
      const prog = computeProgress(units, lessons);
      const doneCount = lessons.filter(l=>l.status!=="cancelled").length;
      let currentName = "";
      if (units.length && prog.currentUnitId){
        const u = units.find(x=>x.id===prog.currentUnitId);
        currentName = u ? u.name : "";
      } else {
        const sorted = lessons.slice().sort((a,b)=> a.date<b.date?1:-1);
        const withUnit = sorted.find(l=>l.unit);
        currentName = withUnit ? withUnit.unit : "（未記録）";
      }
      const pct = prog.totalPlanned>0 ? Math.round(prog.percent*100) : 0;
      h += `<div class="listitem" data-p-course="${c.id}"><span class="t">${esc(c.classLabel)}</span>
        <span class="muted">到達単元：${esc(currentName)} ／ 実施 ${doneCount} コマ</span>
        ${units.length?`<div class="bar" style="margin-top:6px"><div style="width:${pct}%"></div></div>
        <span class="muted">単元進度 ${prog.totalScore} / ${prog.totalPlanned} コマ（${pct}%）</span>`:`<br><span class="muted">単元マスタ未登録（自由記述の到達単元を表示）</span>`}
      </div>`;
    }
  }
  const course = state.courses.find(c=>c.id===state.selectedCourseId) || null;
  if (course){
    const units = (await getUnitsByCourse(course.id)).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const lessons = await dbGetByIndex("lessons","byCourse",course.id);
    const prog = computeProgress(units, lessons);
    const perMap = {}; for (const pu of prog.perUnit) perMap[pu.unitId]=pu;
    h += `<div class="card"><h3 class="sect" style="margin-top:0">単元マスタ ― ${esc(course.subject)} ${esc(course.name)}（${esc(course.classLabel)}）</h3>
    <label class="f">講座を選ぶ</label><select class="t" id="pCourseSel">${courseOptions(course.id)}</select>
    ${units.map((u,i)=>{
      const pu = perMap[u.id] || { planned: u.plannedLessons||0, done: 0 };
      const pct = pu.planned>0 ? Math.min(100, Math.round(pu.done/pu.planned*100)) : 0;
      return `<div class="listitem" style="cursor:default">
        <div class="rowflex">
          <span style="flex:1;min-width:180px">単元名 <input class="t" data-u-name="${u.id}" value="${esc(u.name)}"></span>
          <span>予定コマ <input class="t smallnum" type="number" data-u-planned="${u.id}" value="${esc(u.plannedLessons||0)}"></span>
          <button class="btn small ghost" data-u-up="${u.id}" ${i===0?"disabled":""}>▲ 上へ</button>
          <button class="btn small ghost" data-u-down="${u.id}" ${i===units.length-1?"disabled":""}>▼ 下へ</button>
          <button class="btn small danger" data-u-del="${u.id}">削除</button>
        </div>
        <div class="bar" style="margin-top:6px"><div style="width:${pct}%"></div></div>
        <span class="muted">実施 ${pu.done} ／ 予定 ${pu.planned} コマ</span>
      </div>`;
    }).join("") || `<p class="muted">単元はまだ登録されていません。</p>`}
    <h3 class="sect">単元を追加</h3>
    <div class="rowflex"><span style="flex:1;min-width:180px"><input class="t" id="puName" placeholder="単元名"></span>
    <span>予定コマ <input class="t smallnum" type="number" id="puPlanned" value="5"></span>
    <button class="btn gold" id="puAdd">追加</button></div></div>`;
  }
  root.innerHTML = h;
  bindHome("pHome");
  root.querySelectorAll("[data-p-course]").forEach(el=>el.onclick=()=>{ state.selectedCourseId=el.dataset.pCourse; render(); });
  if (!course) return;
  document.getElementById("pCourseSel").onchange = (e)=>{ state.selectedCourseId=e.target.value||null; render(); };
  const unitsNow = (await getUnitsByCourse(course.id)).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const saveUnit = async (u)=>{ await dbPut("units", u); };
  root.querySelectorAll("[data-u-name]").forEach(el=>el.addEventListener("change", async ()=>{
    const u = unitsNow.find(x=>x.id===el.dataset.uName); if(!u) return;
    u.name = el.value; await saveUnit(u); toast("単元名を保存しました");
  }));
  root.querySelectorAll("[data-u-planned]").forEach(el=>el.addEventListener("change", async ()=>{
    const u = unitsNow.find(x=>x.id===el.dataset.uPlanned); if(!u) return;
    u.plannedLessons = Number(el.value)||0; await saveUnit(u); render();
  }));
  root.querySelectorAll("[data-u-del]").forEach(b=>b.onclick=async ()=>{ await dbDelete("units", b.dataset.uDel); toast("単元を削除しました"); render(); });
  const swapOrder = async (id, dir)=>{
    const idx = unitsNow.findIndex(x=>x.id===id);
    const j = idx + dir;
    if (idx<0 || j<0 || j>=unitsNow.length) return;
    const a = unitsNow[idx], b = unitsNow[j];
    const tmp = a.order; a.order = b.order; b.order = tmp;
    await saveUnit(a); await saveUnit(b); render();
  };
  root.querySelectorAll("[data-u-up]").forEach(b=>b.onclick=()=>swapOrder(b.dataset.uUp, -1));
  root.querySelectorAll("[data-u-down]").forEach(b=>b.onclick=()=>swapOrder(b.dataset.uDown, 1));
  document.getElementById("puAdd").onclick = async ()=>{
    const name = document.getElementById("puName").value.trim();
    if (!name){ toast("単元名を入力してください"); return; }
    const maxOrder = unitsNow.length ? Math.max(...unitsNow.map(u=>u.order||0)) : 0;
    await dbPut("units", { id: uuid(), courseId: course.id, name,
      order: maxOrder+1, plannedLessons: Number(document.getElementById("puPlanned").value)||0, level: 1 });
    toast("単元を追加しました"); render();
  };
}

// ===== 第3期：要確認マーカー（reviewMarkers・Level 2）=====
function markerId(studentId, targetType, targetId){ return `mk:${studentId}:${targetType}:${targetId}`; }
async function loadMarkers(){
  const raw = await getReviewMarkersByYear(state.currentYearId);
  const out = [];
  for (const r of raw){ const d = await decryptMerge(r); if (!d.decryptError) out.push(d); }
  return out;
}
function findMarker(markers, studentId, targetType, targetId){
  return markers.find(m=>m.id===markerId(studentId, targetType, targetId)) || null;
}
function markerTargetLabel(m){
  if (m.targetType==="grades"){
    const [cid, tid] = String(m.targetId||"").split(":");
    const c = state.courses.find(x=>x.id===cid);
    const t = state.terms.find(x=>x.id===tid);
    return `成績・集計${c?`（${c.name}）`:""}${t?` ${t.name}`:""}`;
  }
  if (m.targetType==="comment"){
    const [dk, tid] = String(m.targetId||"").split(":");
    const t = state.terms.find(x=>x.id===tid);
    return `所見の下書き（${docKindLabel(dk)}${t?`・${t.name}`:""}）`;
  }
  return "生徒ページ";
}
function openMarkerSheet(studentId, targetType, targetId, existing){
  const st = studentById(studentId);
  openSheet(`
    <h3 class="sect" style="margin-top:0">⚑ 要確認マーカー ― ${esc(st?displayNameOf(st, null):"")}</h3>
    <p class="muted">対象：${esc(markerTargetLabel({ targetType, targetId }))}。機械の集計や下書きを見て「ここは違うな」と気づいたところに付ける印です。直したら外してください。</p>
    <label class="f">短いメモ（任意・何が気になるか）</label>
    <textarea class="t" id="mkMemo">${esc(existing? (existing.memo||"") : "")}</textarea>
    <div class="rowflex" style="margin-top:12px">
      <button class="btn gold" id="mkSave">${existing?"メモを更新する":"マーカーを付ける"}</button>
      ${existing?`<button class="btn danger" id="mkRemove">マーカーを外す</button>`:""}
      <button class="btn ghost" id="mkCancel">キャンセル</button></div>`);
  document.getElementById("mkCancel").onclick = ()=>closeSheet();
  document.getElementById("mkSave").onclick = async ()=>{
    await putEnc("reviewMarkers",
      { id: markerId(studentId, targetType, targetId), studentId, targetType, targetId, yearId: state.currentYearId, level: 2 },
      { memo: document.getElementById("mkMemo").value, createdAt: existing && existing.createdAt ? existing.createdAt : new Date().toISOString() });
    closeSheet(); toast("要確認マーカーを付けました"); render();
  };
  const rm = document.getElementById("mkRemove");
  if (rm) rm.onclick = async ()=>{
    await dbDelete("reviewMarkers", markerId(studentId, targetType, targetId));
    closeSheet(); toast("マーカーを外しました"); render();
  };
}
function jumpToMarker(m){
  if (m.targetType==="grades"){
    const [cid, tid] = String(m.targetId||"").split(":");
    if (cid) state.selectedCourseId = cid;
    if (tid) state.selectedTermId = tid;
    state.view = "grades";
  } else if (m.targetType==="comment"){
    const [dk, tid] = String(m.targetId||"").split(":");
    state.commentsStudentId = m.studentId;
    if (dk) state.commentsDocKind = dk;
    if (tid) state.selectedTermId = tid;
    state.view = "comments";
  } else {
    state.selectedStudentId = m.studentId;
    state.view = "student";
  }
  render();
}
async function renderReview(root){
  const markers = await loadMarkers();
  markers.sort((a,b)=> (a.updatedAt||"")<(b.updatedAt||"")?1:-1);
  let h = `<div class="rowflex">${backHomeBtn("rvHome")}</div>
  <h2 class="viewtitle">確認待ち一覧（${markers.length}件）</h2>
  <div class="card"><p class="muted" style="margin-top:0">成績の集計結果や所見の下書きを見て「この子のここは違うな」と気づいた箇所に付けた印の一覧です。機械の出力は鵜呑みにせず、違和感を残して直すための仕組みです。対象をタップすると該当箇所へ飛びます。直してマーカーを外すと、この一覧から消えます。</p>
  ${markers.map(m=>{
    const st = studentById(m.studentId);
    return `<div class="listitem" data-rv-jump="${m.id}"><span class="t">⚑ ${esc(st?displayNameOf(st, null):"（不明な生徒）")}</span>
      <br><span class="muted">${esc(markerTargetLabel(m))}</span>
      ${m.memo?`<br>${esc(state.privacyOn?mask(m.memo):m.memo)}`:""}
      <div style="margin-top:4px"><button class="btn small" data-rv-go="${m.id}">該当箇所へ</button>
      <button class="btn small danger" data-rv-remove="${m.id}">直したので外す</button></div></div>`;
  }).join("") || `<p>確認待ちはありません。気になる箇所があれば、成績・生徒ページ・所見づくりの「⚑」ボタンで印を付けておけます。</p>`}
  </div>`;
  root.innerHTML = h;
  bindHome("rvHome");
  const byId = (id)=> markers.find(m=>m.id===id);
  root.querySelectorAll("[data-rv-go]").forEach(btn=>btn.onclick = (e)=>{ e.stopPropagation(); const m = byId(btn.dataset.rvGo); if (m) jumpToMarker(m); });
  root.querySelectorAll("[data-rv-remove]").forEach(btn=>btn.onclick = async (e)=>{
    e.stopPropagation();
    await dbDelete("reviewMarkers", btn.dataset.rvRemove);
    toast("マーカーを外しました"); render();
  });
  root.querySelectorAll("[data-rv-jump]").forEach(el=>el.onclick = (e)=>{
    if (e.target.closest("button")) return;
    const m = byId(el.dataset.rvJump); if (m) jumpToMarker(m);
  });
}

async function loadCommentInputs(studentId){
  // buildCommentMaterials の入力形に合わせて集める（集約結果そのものは保存しない）
  const obsRaw = await dbGetByIndex("observations", "byStudent", studentId);
  const observations = [];
  for (const o of obsRaw){ const d = await decryptMerge(o); if (!d.decryptError) observations.push(d); }
  const yr = yearRange(state.currentYearId);
  const attRaw = await dbGetRange("attendance", "byDate", yr.startDate, yr.endDate);
  const attendanceMarksList = [];
  for (const r of attRaw){
    const d = await decryptMerge(r);
    if (!d.decryptError && d.marks && d.marks[studentId]) attendanceMarksList.push(d.marks);
  }
  const myGroups = state.memberships.filter(m=>m.studentId===studentId).map(m=>m.groupId);
  const myCourses = state.courses.filter(c=>c.groupId && myGroups.includes(c.groupId));
  const submissions = [];
  const scores = [];
  for (const c of myCourses){
    const assigns = await getAssignmentsByCourse(c.id);
    for (const a of assigns){
      const rec = await getEnc("submissionRecords", a.id);
      const stt = rec && rec.states ? rec.states[studentId] : null;
      submissions.push(stt ? { state: stt } : null);
    }
    const tests = await getTestsByCourse(c.id);
    for (const t of tests){
      const rec = await getEnc("scoreRecords", t.id);
      const cur = rec && rec.scores ? rec.scores[studentId] : null;
      if (cur && cur.score != null && !cur.absent) scores.push({ date: t.date || "", score: cur.score, name: t.name || "" });
    }
  }
  const careerRecords = await loadStudentRecords("careerRecords", studentId);
  return { observations, attendanceMarksList, submissions, scores, careerRecords };
}
function sectionViewpointLabel(v){
  if (v === "life") return "生活・行動";
  if (v === "career") return "進路";
  return viewpointLabel(v);
}
function charStatusLabel(cnt, sec){
  const stt = sectionCharStatus(cnt, sec.charMin, sec.charMax);
  if (stt === "none") return "目安なし";
  if (!cnt) return "未入力";
  if (stt === "short") return "目安より短め";
  if (stt === "over") return "目安より長め";
  return "目安の範囲内";
}

    if (!ta) return;
    ta.addEventListener("input", ()=>{
      const cntEl = root.querySelector(`[data-cm-count="${sec.key}"]`);
      if (!cntEl) return;
      cntEl.textContent = `${charCount(ta.value)}字 ― ${charStatusLabel(charCount(ta.value), sec)}`;
    });
  });
  document.getElementById("cmSaveDraft").onclick = async ()=>{
    await putEnc("commentDrafts",
      { id: draft.id, studentId: st.id, docKind, termId: state.selectedTermId, yearId: state.currentYearId, level: 2 },
      { sections: collectSections(), status: draft.status||"draft" });
    toast("所見の下書きを保存しました"); render();
  };
  document.getElementById("cmMarker").onclick = async ()=>{
    const tid = docKind + ":" + state.selectedTermId;
    const cur = findMarker(await loadMarkers(), st.id, "comment", tid);
    openMarkerSheet(st.id, "comment", tid, cur);
  };
  document.getElementById("cmGoReview").onclick = ()=>{ state.view = "review"; render(); };
  document.getElementById("cmSpeak").onclick = ()=>{
    const scope = document.getElementById("cmSpeakScope").value;
    const secs = scope==="all" ? tpl.sections : tpl.sections.filter(s2=>s2.key===scope);
    const parts = [];
    secs.forEach(sec=>{
      const el = document.getElementById("cmSec_"+sec.key);
      const v = el ? el.value.trim() : "";
      if (v) parts.push(v);
    });
    if (!parts.length){ toast("読み上げる本文がありません"); return; }
    stopSpeech();
    speakText(parts.join("。\n"));
  };
  document.getElementById("cmSpeakStop").onclick = ()=>{ stopSpeech(); toast("読み上げを止めました"); };
  document.getElementById("cmFinalize").onclick = async ()=>{
    const next = draft.status==="final" ? "draft" : "final";
    await putEnc("commentDrafts",
      { id: draft.id, studentId: st.id, docKind, termId: state.selectedTermId, yearId: state.currentYearId, level: 2 },
      { sections: collectSections(), status: next });
    toast(next==="final" ? "確定しました。成績画面の「転記サポート」に載ります" : "下書きに戻しました"); render();
  };
  renderAiPanel(st, tpl, collectSections);
}

// ===== ローカルAI（Ollama）支援パネル：所見の推敲のみ =====
function maskStudentText(text, st){
  // プライバシーモード中は自由記述を伏せる（第2期の表示時マスクと同じ考え方）
  if (state.privacyOn) return mask(text||"");
  return text||"";
}
async function aiGenerate(promptText){
  const s = settings();
  const host = (s.aiHost||"http://127.0.0.1:11434").replace(/\/+$/,"");
  const model = s.aiModel||"";
  if (!model) throw new Error("モデル名が未設定です。設定画面でモデル名を入力してください。");
  const res = await fetch(host + "/api/generate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model, prompt: promptText, stream: false })
  });
  if (!res.ok) throw new Error("Ollama からエラーが返りました（HTTP " + res.status + "）");
  const data = await res.json();
  return (data && data.response) || "";
}
function renderAiPanel(st, tpl, collectSections){
  const panel = document.getElementById("cmAiPanel");
  if (!panel) return;
  const s = settings();
  if (!s.aiEnabled){
    panel.innerHTML = `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:10px">
      <p class="muted">AI支援（ローカルAI・Ollama）は無効です。使う場合は設定画面で有効にしてください。クラウドAIは使いません。</p></div>`;
    return;
  }
  panel.innerHTML = `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:10px">
    <h4 class="sect" style="margin:0">AI支援（ローカルAI・Ollama）― 所見の推敲</h4>
    <p class="muted">対象の節を選んで「推敲案を作る」を押すと、氏名を番号・イニシャルに置き換えた文面のプレビューが出ます。内容を確認・編集してから送信します。候補は自動では保存されず、「採用する」を押したときだけ下書きに入ります。Level 3 の記録は AI の対象外です。</p>
    <div class="rowflex"><span style="flex:1">対象の節 <select class="t" id="aiSec">${tpl.sections.map(sec=>`<option value="${sec.key}">${esc(sec.label)}</option>`).join("")}</select></span>
    <button class="btn" id="aiPreviewBtn">推敲案を作る（プレビュー）</button></div>
    <div id="aiPreviewBox"></div>
    <div id="aiResultBox"></div></div>`;
  document.getElementById("aiPreviewBtn").onclick = ()=>{
    const secId = document.getElementById("aiSec").value;
    const ta = document.getElementById("cmSec_"+secId);
    const original = ta ? ta.value : "";
    if (!original.trim()){ toast("対象の節に下書きがありません"); return; }
    const m0 = state.memberships.find(m=>m.studentId===st.id);
    const reps = [];
    if (st.name) reps.push({ from: st.name, to: m0 && m0.no!=null ? (m0.no+"番の生徒") : "この生徒" });
    if (st.initials) reps.push({ from: st.initials, to: "この生徒" });
    const anon = anonymizeText(original, reps);
    const box = document.getElementById("aiPreviewBox");
    box.innerHTML = `<label class="f">送信前プレビュー（置換済み・編集できます）</label>
      <textarea class="t" id="aiAnonText" style="min-height:90px">${esc(anon)}</textarea>
      <p class="muted">この文面が、この PC の Ollama（${esc(s.aiHost||"http://127.0.0.1:11434")}）にだけ送られます。外部には送信されません。</p>
      <button class="btn gold" id="aiSendBtn">この内容で送信する</button>`;
    document.getElementById("aiSendBtn").onclick = async ()=>{
      const sendText = document.getElementById("aiAnonText").value;
      const rbox = document.getElementById("aiResultBox");
      rbox.innerHTML = `<p class="muted">生成中です…（PC の Ollama が応答するまで時間がかかることがあります）</p>`;
      try {
        const out = await aiGenerate("次の所見文を、意味を変えずに、より自然で温かみのある日本語に推敲してください。推敲した文だけを返してください。\n\n" + sendText);
        if (!out.trim()) throw new Error("空の応答が返りました");
        rbox.innerHTML = `<label class="f">AI の候補（まだ下書きには入っていません）</label>
          <div class="card" style="margin:6px 0" id="aiCandidate">${esc(out.trim())}</div>
          <button class="btn gold" id="aiAdoptBtn">この候補を下書きに採用する</button>`;
        document.getElementById("aiAdoptBtn").onclick = ()=>{
          const target = document.getElementById("cmSec_"+secId);
          if (target){ target.value = out.trim(); target.dispatchEvent(new Event("input", { bubbles: true })); }
          toast("候補を下書きに入れました。「下書きを保存」で確定してください");
        };
      } catch (e){
        rbox.innerHTML = `<p style="color:var(--danger)">AI の生成に失敗しました：${esc(e.message||String(e))}<br>PC で Ollama が起動しているか、設定の接続先・モデル名と、環境変数 OLLAMA_ORIGINS=* の設定を確認してください。</p>`;
      }
    };
  };
}

  </div>
  <div class="card"><h3 class="sect" style="margin-top:0">この部の予定（行事カレンダーと共通）</h3>
  ${clubEvents.map(e=>`<div class="listitem" data-club-event="${e.id}"><span class="muted">${esc(e.startDate)}${e.endDate&&e.endDate!==e.startDate?` 〜 ${esc(e.endDate)}`:""}</span>
    <span class="chip" style="background:${esc(categoryColor(e.category))};color:#fff">${esc(categoryLabel(e.category))}</span>
    <br><span class="t">${esc(state.privacyOn?mask(e.title):e.title)}</span></div>`).join("") || `<p class="muted">予定はまだありません。</p>`}
  <button class="btn small gold" id="clEventAdd">＋ この部の予定を追加</button></div>
  <div class="card"><h3 class="sect" style="margin-top:0">活動実績</h3>
  ${acts.map(r=>`<div class="listitem" data-club-act="${r.id}"><span class="muted">${esc(r.date||"")}</span> <span class="chip">${esc(clubActivityKindLabel(r.kind))}</span>
    ${r.result?`<br><span class="t">${esc(state.privacyOn?mask(r.result):r.result)}</span>`:""}
    ${r.note?`<br>${esc(state.privacyOn?mask(r.note):r.note)}`:""}
    ${r.costMemo?`<br><span class="muted">部費・備品：${esc(state.privacyOn?mask(r.costMemo):r.costMemo)}</span>`:""}</div>`).join("") || `<p class="muted">実績はまだありません。</p>`}
  <button class="btn small gold" id="clActAdd">＋ 活動実績を追加</button></div>`;
  root.innerHTML = h;
  bindHome("clHome");
  document.getElementById("clGoRoster").onclick = ()=>{ state.view="roster"; render(); };
  root.querySelectorAll("[data-club]").forEach(el=>el.onclick = ()=>{ state.selectedClubId = el.dataset.club; render(); });
  root.querySelectorAll("[data-club-member]").forEach(el=>el.onclick = async ()=>{
    const sid = el.dataset.clubMember;
    const prof = profileOf(sid) || { id: uuid(), studentId: sid, groupId: sel.id, yearId: state.currentYearId, level: 2, role: "", position: "", note: "" };
    openSheet(`
      <h3 class="sect" style="margin-top:0">部員の役割・担当 ― ${esc(displayNameOf(studentById(sid), sel.id))}</h3>
      <label class="f">役割（主将・副主将・部長など）</label><input class="t" id="mpRole" value="${esc(prof.role||"")}">
      <label class="f">担当（パート・ポジションなど）</label><input class="t" id="mpPos" value="${esc(prof.position||"")}">
      <label class="f">メモ</label><textarea class="t" id="mpNote">${esc(prof.note||"")}</textarea>
      <div class="rowflex" style="margin-top:12px"><button class="btn gold" id="mpSave">保存する</button>
      <button class="btn" id="mpGoStudent">カルテを開く</button>
      <button class="btn ghost" id="mpCancel">キャンセル</button></div>`);
    document.getElementById("mpCancel").onclick = ()=>closeSheet();
    document.getElementById("mpGoStudent").onclick = ()=>{ closeSheet(); state.selectedStudentId = sid; state.view = "student"; render(); };
    document.getElementById("mpSave").onclick = async ()=>{
      await putEnc("memberProfiles",
        { id: prof.id, studentId: sid, groupId: sel.id, yearId: state.currentYearId, level: 2 },
        { role: document.getElementById("mpRole").value, position: document.getElementById("mpPos").value, note: document.getElementById("mpNote").value });
      closeSheet(); toast("保存しました"); render();
    };
  });
  document.getElementById("clEventAdd").onclick = ()=>openEventSheet(null, todayString(), { category: "club", groupId: sel.id });
  root.querySelectorAll("[data-club-event]").forEach(el=>el.onclick = ()=>{
    const ev = state.eventsCache.find(e=>e.id===el.dataset.clubEvent);
    if (ev) openEventSheet(ev);
  });
  document.getElementById("clActAdd").onclick = ()=>openClubActivitySheet(sel.id, null);
  root.querySelectorAll("[data-club-act]").forEach(el=>el.onclick = async ()=>{
    const rec = await getEnc("clubActivities", el.dataset.clubAct);
    if (rec && !rec.decryptError) openClubActivitySheet(sel.id, rec);
  });
}

// ===== 第3期：統合ToDo（todos）=====
async function renderTodos(root){
  const all = await getTodosByYear(state.currentYearId);
  const today = todayString();
  const open = all.filter(t=>!t.done).sort((a,b)=>{
    const da = a.dueDate||"9999-12-31", db = b.dueDate||"9999-12-31";
    if (da!==db) return da<db?-1:1;
    return (TODO_PRIORITY_ORDER[a.priority]??1)-(TODO_PRIORITY_ORDER[b.priority]??1);
  });
  const done = all.filter(t=>t.done);
  const originLabel = async (t)=>{
    if (!t.originType) return "";
    if (t.originType==="workRecord"){
      const wr = await dbGet("workRecords", t.originId);
      return wr ? `出所：会議メモ「${esc(wr.title||"（件名なし）")}」（${esc(wr.date||"")}）` : "出所：会議メモ";
    }
    return "出所：" + esc(t.originType);
  };
  let h = `<div class="rowflex">${backHomeBtn("tdHome")}</div>
  <h2 class="viewtitle">ToDo</h2>
  <div class="card"><h3 class="sect" style="margin-top:0">未完了（${open.length}件）</h3>
  ${open.length ? (await Promise.all(open.map(async t=>`<div class="listitem" data-todo="${t.id}">
    <span class="t">${esc(state.privacyOn?mask(t.title):t.title)}</span>
    <br><span class="muted">${t.dueDate?`期限 ${esc(t.dueDate)}${t.dueDate<today?" ⚠ 期限超過":""}`:"期限なし"} ／ 優先度 ${esc(todoPriorityLabel(t.priority))}</span>
    ${(await originLabel(t))?`<br><span class="muted">${await originLabel(t)}</span>`:""}
    <div style="margin-top:4px"><button class="btn small gold" data-todo-done="${t.id}">完了にする</button></div></div>`))).join("")
    : `<p class="muted">未完了の ToDo はありません。</p>`}
  <button class="btn gold" id="tdAdd">＋ ToDoを追加</button></div>
  ${done.length?`<div class="card"><h3 class="sect" style="margin-top:0">完了（${done.length}件）</h3>
  ${done.map(t=>`<div class="listitem" data-todo="${t.id}"><span class="muted" style="text-decoration:line-through">${esc(state.privacyOn?mask(t.title):t.title)}</span></div>`).join("")}</div>`:""}`;
  root.innerHTML = h;
  bindHome("tdHome");
  document.getElementById("tdAdd").onclick = ()=>openTodoSheet(null, null);
  root.querySelectorAll("[data-todo]").forEach(el=>el.onclick = async (e)=>{
    if (e.target.closest("[data-todo-done]")) return;
    const t = await dbGet("todos", el.dataset.todo);
    if (t) openTodoSheet(t, null);
  });
  root.querySelectorAll("[data-todo-done]").forEach(btn=>btn.onclick = async (e)=>{
    e.stopPropagation();
    const t = await dbGet("todos", btn.dataset.todoDone);
    if (t){ t.done = true; await dbPut("todos", t); toast("完了にしました"); render(); }
  });
}

// ===== 第3期：ヘルプ目次（helpindex）=====
function renderHelpIndex(root){
  const q = (state.helpQuery||"").trim();
  const entries = AREAS.filter(a=>a.enabled && HELP_TEXTS[a.id]);
  const hit = (a)=>{
    if (!q) return true;
    const ht = HELP_TEXTS[a.id];
    const hay = [a.name, (ht.can||[]).join(" "), (ht.steps||[]).join(" "), (ht.notes||[]).join(" "), Array.isArray(ht.keywords) ? ht.keywords.join(" ") : (ht.keywords||"")].join(" ");
    return hay.includes(q);
  };
  const list = entries.filter(hit);
  root.innerHTML = `<div class="rowflex">${backHomeBtn("hiHome")}</div>
  <h2 class="viewtitle">ヘルプ目次</h2>
  <div class="card"><label class="f">キーワードで探す</label>
  <div class="rowflex"><input class="t" id="hiQuery" value="${esc(state.helpQuery||"")}" placeholder="例：出席、印刷、暗号化" style="flex:1">
  <button class="btn" id="hiSearch">検索</button></div>
  <p class="muted">各画面のヘッダーにある「？ ヘルプ」ボタンからも、その画面のヘルプを直接開けます。</p></div>
  ${list.map(a=>`<div class="listitem" data-hi="${a.id}"><span class="t">${esc(a.icon||"")} ${esc(a.name)}</span>
    <br><span class="muted">${esc((HELP_TEXTS[a.id].can||[])[0]||"")}</span>
    <div style="margin-top:4px"><button class="btn small" data-hi-open="${a.id}">この画面のヘルプを開く</button>
    <button class="btn small ghost" data-hi-go="${a.id}">画面へ移動</button></div></div>`).join("") || `<p class="muted">該当するヘルプがありません。キーワードを変えてみてください。</p>`}`;
  bindHome("hiHome");
  const doSearch = ()=>{ state.helpQuery = document.getElementById("hiQuery").value; render(); };
  document.getElementById("hiSearch").onclick = doSearch;
  document.getElementById("hiQuery").addEventListener("keydown", (e)=>{ if (e.key==="Enter") doSearch(); });
  root.querySelectorAll("[data-hi-open]").forEach(btn=>btn.onclick = (e)=>{ e.stopPropagation(); openHelp(btn.dataset.hiOpen); });
  const go = (view)=>{ state.view = view; render(); };
  root.querySelectorAll("[data-hi-go]").forEach(btn=>btn.onclick = (e)=>{ e.stopPropagation(); go(btn.dataset.hiGo); });
  root.querySelectorAll("[data-hi]").forEach(el=>el.onclick = (e)=>{ if (e.target.closest("button")) return; openHelp(el.dataset.hi); });
}

// ===== 起動 =====
(async function boot(){
  try {
    await openDB();
    let schema = await dbGet("meta", "schema");
    if (!schema){ schema = { key:"schema", schemaVersion: DB_VERSION, createdAt: new Date().toISOString() }; await dbPut("meta", schema); }
    else if (schema.schemaVersion !== DB_VERSION){ schema.schemaVersion = DB_VERSION; await dbPut("meta", schema); }
    state.security = await dbGet("meta", "security");
    if (!state.security){ startWizard(1); }
    else showLock();
  } catch(e){
    document.getElementById("lockScreen").classList.remove("hidden");
    document.getElementById("lockMsg").textContent = "データベースを開けませんでした：" + (e && e.message ? e.message : e);
  }
})();
</script>
